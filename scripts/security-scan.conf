# =====================================================================
# security-scan.conf — thresholds & tuning for SEC Phase 10 scanning.
#
# Sourced by scripts/security-scan.sh (and by scripts/security-baseline.sh
# for the mail-tool watchlist). Plain data assignments only — post-
# observation tuning (after the 2-week observation window in
# security_todo.md §Phase 10) is a CONFIG EDIT here, not a code change.
#
# Conventions:
#   IP/CIDR sets  -> bash arrays of dotted-quad / CIDR strings
#   port sets     -> bash arrays of integers
#   noise patterns-> grep -E patterns (matched against finding evidence)
# =====================================================================

# --- Paths (host data dir, not repo paths) ----------------------------
SEC_DATA_DIR="/home/chuck/data/security"
SEC_BASELINE_FILE="$SEC_DATA_DIR/baseline.txt"
SEC_REPORTS_DIR="$SEC_DATA_DIR/reports"
SEC_ALERTS_LOG="$SEC_DATA_DIR/alerts.log"

# Observation mode: 1 = report only, nothing escalated (first 2 weeks,
# per Phase 10 "False-positive tuning"). Flip to 0 once thresholds are
# tuned from observed noise.
OBSERVATION_MODE=1

# --- Known-good source addresses (auth.log check) ---------------------
# Failed passwords / invalid users from anywhere OUTSIDE this set are
# anomalies. 192.168.4.0/24 = home LAN (thor is .54); 192.168.5.0/24 =
# second LAN segment; 10.8.0.2 = known remote peer (per Phase 10 spec).
KNOWN_IPS=(
  "10.8.0.2"
  "192.168.4.0/24"
  "192.168.5.0/24"
)

# --- CDN / Cloudflare ranges (outbound "new external peer" notes) -----
# Cloudflare's published IPv4 ranges (https://www.cloudflare.com/ips-v4).
# New external peers inside these are CDN/edge traffic — not a note.
# The list changes rarely; review periodically.
CDN_CIDRS=(
  "173.245.48.0/20"
  "103.21.244.0/22"
  "103.22.200.0/22"
  "103.31.4.0/22"
  "141.101.64.0/18"
  "108.162.192.0/18"
  "190.93.240.0/20"
  "188.114.96.0/20"
  "197.234.240.0/22"
  "198.41.128.0/17"
  "162.158.0.0/15"
  "104.16.0.0/13"
  "104.24.0.0/14"
  "172.64.0.0/13"
  "131.0.72.0/22"
)

# --- SMTP (this host must never send mail) ----------------------------
# Any outbound ESTAB connection to these ports = immediate anomaly.
SMTP_PORTS=(25 465 587)

# Mail-tool watchlist: if any of these binaries is present on the host,
# that is an anomaly (expected: none present). Sourced by
# security-baseline.sh for the baseline capture.
MAIL_TOOLS=(sendmail msmtp ssmtp mail mutt swaks postfix)

# --- Noise baselines ---------------------------------------------------
# grep -E patterns for KNOWN noise: a finding whose evidence matches any
# of these is suppressed (not reported). Seeded with the obvious; grow
# this list during the 2-week observation window from real scan output.
NOISE_PATTERNS=(
  # HikariCP-style pool noise: Java connection-pool housekeeping
  # threads / log lines (e.g. "HikariPool-1 housekeeper") are not
  # "unknown long-running process" findings.
  "HikariPool-[0-9]+ (Housekeeper|housekeeper|connection)"
  # apt/dpkg maintenance is expected host churn (filtered elsewhere via
  # dpkg.log too, but this keeps the process/log checks quiet).
  "apt-get|dpkg (configure|install|remove)"
)

# --- Retention / staleness ---------------------------------------------
RETENTION_DAILY_DAYS=90
RETENTION_WEEKLY_WEEKS=52
# Baseline older than this (days) is itself a warning (stale baseline).
BASELINE_STALE_DAYS=30
