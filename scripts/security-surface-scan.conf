# =====================================================================
# security-surface-scan.conf — thresholds & tuning for SEC Phase 11
# public-surface scanning.
#
# Sourced by scripts/security-surface-scan.sh (daily) and
# scripts/security-surface-weekly.sh (weekly). Plain data assignments
# only — post-observation tuning (after the 2-week observation window)
# is a CONFIG EDIT here, not a code change.
#
# Conventions:
#   paths/strings   -> plain assignments
#   expectation sets-> bash arrays
#   noise patterns  -> grep -E patterns (matched against finding evidence)
# =====================================================================

# --- Paths (host data dir + live-repo reads, not repo paths) -----------
SEC_SURFACE_DATA_DIR="/home/chuck/data/security-surface"
# Phase 10 node-exporter textfile dir: a REAL COPY of the prom file is
# synced here after every scan (node_exporter's textfile collector does
# NOT follow symlinks). Empty = sync disabled.
SEC_METRICS_SYNC_DIR="/home/chuck/data/security/metrics"
# Read-only inputs (the scan never writes to these):
CADDYFILE_PATH="/home/chuck/homelab/caddy/Caddyfile"
ENV_FILE="/home/chuck/homelab/.env"

# Observation mode: 1 = report only, nothing escalated (first 2 weeks,
# per the Phase 10/11 observation-mode contract). Flip to 0 once
# thresholds are tuned from observed noise.
OBSERVATION_MODE=1

# --- Probes -------------------------------------------------------------
# curl timeout per probe (s). The public surface sits behind the CF
# tunnel; 30s is generous for a GET that should answer in <2s.
PROBE_TIMEOUT=30
# Honest UA (the probes are read-only GET/HEAD; no mutating requests).
PROBE_USER_AGENT="homelab-security-scan/1.0 (SEC Phase 11; read-only)"
# Chuck's LiteLLM key for `with: chuck-key` probes comes from ENV_FILE
# (LITELLM_KEY_CHUCK) or the environment — never stored here, never
# printed in reports/alerts (evidence is status codes + headers only).

# --- TLS expectations (per domain) --------------------------------------
# cert expiry < ALERT days = anomaly; < WARN days = note.
CERT_EXPIRY_ALERT_DAYS=14
CERT_EXPIRY_WARN_DAYS=30

# --- Security headers (checked on https://<domain>/) --------------------
# "HeaderName:severity" — a missing response header is a finding at that
# severity. HSTS is NOTE by default: CF terminates TLS (Caddy auto_https
# off), so HSTS is an edge concern, tracked not alarmed. X-Content-Type-
# Options is set by the Caddyfile global header block on every response —
# its absence means the config changed.
EXPECT_HEADERS=(
  "Strict-Transport-Security:note"
  "X-Content-Type-Options:anomaly"
)

# --- Known-CVE watchlist (the monthly §9 refresh feeds this) ------------
# "component|version-ERE|CVE-id|severity" — a registry stack/db_stack
# entry whose component + version matches becomes a finding at the given
# severity (critical|anomaly|note). This makes the daily CVE cross-check
# (11.5) config-driven: the monthly §9 pass updates THIS LIST, the daily
# scan does the matching. Seeded from §9.3 (9.3-M1: MySQL 8.4.0–8.4.12,
# CVE-2026-101679, 7.5 unauth DoS — LAN-only per 9.3-M1, hence anomaly,
# not critical). Host MySQL is 8.4.13 as of 2026-11-27 → no match; the
# check confirms the version is out of the affected range.
KNOWN_CVES=(
  "mysql|8\\.4\\.(1[0-2])|CVE-2026-101679|anomaly"
)

# --- Noise baselines ------------------------------------------------------
# grep -E patterns for KNOWN noise: a finding whose evidence matches any
# of these is suppressed (not reported). Seeded empty; grow during the
# 2-week observation window from real scan output.
NOISE_PATTERNS=()

# --- Retention / staleness ------------------------------------------------
RETENTION_DAILY_DAYS=90
RETENTION_WEEKLY_WEEKS=52
# Weekly DB schema-diff snapshots (keep the newest for the diff; prune
# older ones after this many weeks).
DB_SNAPSHOT_RETENTION_WEEKS=52

# --- InvestHub DB (weekly schema-diff) ------------------------------------
# Credentials come from ENV_FILE (INVEST_DATABASE_URL =
# mysql://user:pass@host:port/db) — the app's own DB user. The snapshot
# covers information_schema (tables, columns) + the app user's privilege
# surface (schema_privileges); mysql.user enumeration needs a DBA account
# and is out of scope for the app credential.
INVEST_DB_NAME="investorhub"
# Host-side MySQL reachability: `thor.local` resolves IPv6-only on the
# host (no A record) while MySQL binds 192.168.4.54:3306 (.env note,
# 2026-11-21; same pattern as MYSQL_DB_HOST for the backup tools).
# Containers reach thor.local fine; the host-side weekly check uses this
# fallback if the URL's host is unreachable from the host.
DB_HOST_FALLBACK="192.168.4.54"
