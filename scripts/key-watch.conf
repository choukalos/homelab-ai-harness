# =====================================================================
# key-watch.conf — thresholds & tuning for SEC Phase 6 key/auth watching.
#
# Sourced by scripts/key-auth-watch.sh, scripts/key-spend-watch.sh, and
# scripts/audit-litellm-keys.sh. Plain data assignments only —
# post-observation tuning is a CONFIG EDIT here, not a code change
# (same convention as scripts/security-scan.conf, Phase 10).
#
# Data paths follow the Phase 10 host-data-dir convention
# (/home/chuck/data/security, not repo paths) so the repo stays clean
# and the state survives repo resets.
# =====================================================================

# --- Paths (host data dir) -------------------------------------------
KEYWATCH_DATA_DIR="/home/chuck/data/security"
KEYWATCH_METRICS_DIR="$KEYWATCH_DATA_DIR/metrics"
KEYWATCH_STATE_DIR="$KEYWATCH_DATA_DIR/state"
KEYWATCH_REPORTS_DIR="$KEYWATCH_DATA_DIR/reports"
KEYWATCH_ALERTS_LOG="$KEYWATCH_DATA_DIR/alerts.log"
KEYWATCH_SPEND_STATE_FILE="$KEYWATCH_STATE_DIR/key-spend-state.json"
KEYWATCH_AUDIT_SNAPSHOT_FILE="$KEYWATCH_DATA_DIR/key-inventory-snapshot.json"

# Observation mode (Phase 10 convention): 1 = threshold breaches log at
# `note` severity (report-only, first 2 weeks); 0 = `alert` severity.
# Metrics are always recorded either way.
OBSERVATION_MODE=1

# --- 401 spike (key-auth-watch.sh) ------------------------------------
# Caddy container whose access logs are parsed.
KEYWATCH_CADDY_CONTAINER="caddy"
# Gated public hosts to watch (the two Caddy key gates, Phase 1).
KEYWATCH_GATED_HOSTS=("llm.choukalos.com" "siri.choukalos.com")
# Look back this many minutes when counting (the systemd timer fires
# every 5 min; 6 gives overlap so a boundary 401 is never missed).
KEYWATCH_401_WINDOW_MIN=6
# Alert when a host has MORE THAN this many 401s in the window
# (≈ sustained >2/min at the 5-min cadence). Baseline expectation is
# ~0 (only wrong/stale keys + scanners); tune after the observation
# window from real counts.
KEYWATCH_401_THRESHOLD=10

# --- Spend (key-spend-watch.sh) ---------------------------------------
# Per-key 24h spend limit in USD. Unknown keys get the default.
# chuck/dylan: observed average ≈ $22.6/day (Oct 4–Nov 27, $1220.60
# total) — $50 leaves headroom for heavy work days. Agent keys: $20
# (a runaway agent loop burns far more than a normal day). internal-service:
# $50 — it legitimately rides matrix-coder for internal work (skill
# synthesis, nl→sql, frame analysis, kanban service profile). Unaliased
# keys (e.g. the memory-service key) are labeled by token prefix in
# the metrics and get the default limit.
SPEND_LIMIT_DEFAULT=20
# alias=limit overrides (bash array; "alias=usd" entries).
SPEND_LIMIT_OVERRIDES=(
  "chuck=50"
  "dylan=50"
  "internal-service=50"
)
# Rolling window for the spend metric (hours).
SPEND_WINDOW_HOURS=24

# --- Audit (audit-litellm-keys.sh) ------------------------------------
# Quarterly rotation cadence: a key older than this (days) is flagged
# "rotation due" (Phase 6 item 4; flow = ./homelab.sh key rotate).
ROTATION_DUE_DAYS=90
