[project]
name = "mcp-memory"
version = "0.1.0"
description = "MCP server for per-user long-term memory retrieval (wraps skill-runner scoped memory endpoints)"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-memory = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"