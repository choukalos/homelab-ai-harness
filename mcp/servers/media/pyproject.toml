[project]
name = "mcp-media"
version = "0.1.0"
description = "MCP server for media generation (GPU-host media-pipeline) and image metadata"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-media = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"