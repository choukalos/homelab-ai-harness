# mcp_kanban — LiteLLM proxy MCP registration (homelab).
#
# Registers the mcp_kanban container's MCP endpoint (POST /mcp, streamable
# HTTP) with the LiteLLM proxy, so LLM clients can drive the board by
# conversation. Applied as the `mcp_kanban` entry under `mcp_servers:` in
# litellm/config.yml (see the live config header for the applied date).
#
# Transport: `http` = MCP streamable HTTP (LiteLLM MCPTransport.http). The
# kanban app serves stateless streamable HTTP at POST /mcp (fresh
# server + transport per request), so no SSE endpoint is needed.
#
# Identity threading (same pattern as mcp_sessions / mcp_skills): the
# caller's LiteLLM key is forwarded to the container via the
# Authorization header (extra_headers: [Authorization]) and the container
# scopes the tool set per key (MCP_KEY_CAPABILITIES). The kanban key
# (LITELLM_API_KEY in the container) always gets the full tool set.
#
# NOTE: LiteLLM v1.104.0 supports `transport: http` (verified in the
# running image: litellm.types.mcp.MCPTransport = {sse, http, stdio}).
#
# Tool names are exposed BARE (native server tool names, e.g.
# `list_projects`) — LiteLLM v1.104 does not prefix MCP tool names with
# the server id; same as the other 13 servers (media_*, sessions_* ...).
# Verified 2026-11-21: 23 kanban tools registered (MCP-first cutover:
# interactive grooming + board_status + discard_idea; groom_idea removed),
# no collisions with the existing 94.
#
# Discovery vs call auth: the app allows UNAUTHENTICATED discovery
# (initialize / tools/list / ping) so the proxy's global registry
# handshake works without a key; `tools/call` and every mutating
# operation still require a valid Bearer key (unknown key -> 401).
# Per-key tool scoping (MCP_KEY_CAPABILITIES) is enforced at call time,
# inside the app.

mcp_servers:
  mcp_kanban:
    transport: http
    url: http://mcp_kanban:3000/mcp
    extra_headers:
      - Authorization
    timeout: 7200
