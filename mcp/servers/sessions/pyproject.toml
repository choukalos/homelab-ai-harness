[project]
name = "mcp-sessions"
version = "0.1.0"
description = "MCP server for remote session transcript ingest + owner-scoped read-back (wraps skill-runner scoped session endpoints)"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
mcp-sessions = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
