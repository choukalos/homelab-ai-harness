# mcp_filebridge registry — P12-A + P12-B (SEC-12).
#
# Three sections (linted at boot + standalone: `python app.py lint`):
#
# public_file_serving: GET /media/files/{path} (Caddy, siri.choukalos.com +
#   choukalos.com). DEFAULT-DENY: only `allow`ed top-level subdirs of `root`
#   are publicly served; everything else -> 404 (not 403 — do not leak which
#   subdirs exist). Finding 12.4: siri_outputs (human-readable enumerable
#   personal Q&A) is deliberately NOT allowlisted (D13: siri-only; siri keeps
#   its own access path — skill API artifact endpoint + LAN).
#
# work_areas (P12-B): the registered thor work areas + the Matrix pipeline
#   (api area, first-class per D12). Default-deny: anything not registered
#   is invisible to the MCP face (file_pull/file_push) and to public
#   serving. Adding an area = one entry.
#
# publish_targets (P12-B): where file_push / file_publish can publish
#   (P12-C extracts the publish-file engine; same semantics, parameterized
#   by this config). 'files' is a banned subdir (it would produce
#   /files/files/).

public_file_serving:
  root: /home/chuck/data/media
  allow:
    - generated      # generated artifacts (incl. generated/pipeline fetch dir)
    - images
    - demos
    - presentations

work_areas:
  media_staging:    {path: /home/chuck/workspace/media}
  pipeline_fetch:   {path: /home/chuck/data/media/generated/pipeline}
  siri_outputs:     {path: /home/chuck/data/media/siri_outputs, remote_write: false}   # siri-only (D13)
  nas_media_store:  {path: /mnt/lego-media-store, automount: true, shared_output: true}  # shared persistent output for other clients (D13)
  matrix_pipeline:  {api: http://192.168.4.55:8189}                                      # first-class (D12); /upload + /dl + /files

publish_targets:
  blog:        # homelab files area (existing engine — P12-C)
    root: /home/chuck/data/media/public
    subdirs: [ai, images, audio, video, tabs]
    default_subdir: ai
    url_base: https://choukalos.com/files
    source_roots: [/home/chuck/data/media, /home/chuck/workspace]
    size_cap_mb: 500
  nas:         # publish to the NAS media store (D14; decision 4-published)
    root: /mnt/lego-media-store/published
    subdirs: []                # flat — no subdirs
    url_base: ""               # not public — access via work-area tools / 1b tokens
    source_roots: [/home/chuck/data/media, /home/chuck/workspace]
    size_cap_mb: 500
  # bluebovine: (future — adapter interface defined in P12-C, no impl now (D14))
