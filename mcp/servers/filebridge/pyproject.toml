[project]
name = "mcp-filebridge"
version = "0.1.0"
description = "The homelab's single public file edge (P12-A + P12-B, SEC-12): transparent pipeline relays, policy-gated /media/files serving, 1b signed tokens, MCP face (file_pull/file_push/file_work_areas/file_targets)"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-filebridge = "app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop per session: the MCP session manager's task group must be
# entered and exited in the same task, so it lives in a session-scoped
# background task (mcp_session fixture) shared by all async tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
