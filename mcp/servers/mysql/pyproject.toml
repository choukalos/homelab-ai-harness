[project]
name = "mcp-mysql"
version = "0.1.0"
description = "MCP server for read-only MySQL database access with NL-to-SQL translation"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
    "mysql-connector-python>=8.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-mysql = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
