[project]
name = "mcp-knowledge"
version = "0.1.0"
description = "MCP server for read-only knowledge base retrieval via Qdrant"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-knowledge = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
