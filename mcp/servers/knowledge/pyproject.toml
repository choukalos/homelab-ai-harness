[project]
name = "mcp-knowledge"
version = "0.2.0"
description = "MCP server for the family KB (Qdrant kb_* collections): ingest, search, correct, forget, backup"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "qdrant-client>=1.7.0",
    "httpx>=0.27",
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-knowledge = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
