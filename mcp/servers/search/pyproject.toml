[project]
name = "mcp-search"
version = "0.1.0"
description = "MCP server for web search via SearXNG"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-search = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
