[project]
name = "mcp-skills"
version = "0.1.0"
description = "MCP server for cross-client skill discovery and execution (wraps skill-runner)"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-skills = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"