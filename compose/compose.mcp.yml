# Docker Compose for MCP (Model Context Protocol) server containers
# Each MCP server runs as a standalone container on the ai-net network.
# LiteLLM reaches them by service name (e.g. http://mcp_knowledge:8000/mcp).

name: ai-mcp

services:

  mcp_knowledge:
    build:
      context: ../mcp/servers/knowledge
    container_name: mcp_knowledge
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_TIMEOUT=15
    restart: unless-stopped
    networks:
      - ai-net

  mcp_search:
    build:
      context: ../mcp/servers/search
    container_name: mcp_search
    environment:
      - SEARXNG_URL=http://searxng:8080
      - SEARXNG_TIMEOUT=10
    restart: unless-stopped
    networks:
      - ai-net

  mcp_crawl:
    build:
      context: ../mcp/servers/crawl
    container_name: mcp_crawl
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
    restart: unless-stopped
    networks:
      - ai-net

  mcp_filesystem_readonly:
    build:
      context: ../mcp/servers/filesystem_readonly
    container_name: mcp_filesystem_readonly
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace:ro
      - /home/chuck/data/media:/home/chuck/data/media:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_mysql:
    build:
      context: ../mcp/servers/mysql
    container_name: mcp_mysql
    environment:
      - MYSQL_HOST=thor.local
      - MYSQL_PORT=3306
      - MYSQL_USER=${AI_DB_USER}
      - MYSQL_PASSWORD=${AI_DB_PASS}
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=studio-gemma4-4b
    restart: unless-stopped
    networks:
      - ai-net

  mcp_homelab_status:
    build:
      context: ../mcp/servers/homelab_status
    container_name: mcp_homelab_status
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ai-net

  # --- New MCP servers -------------------------------------------------------

  mcp_filesystem:
    build:
      context: ../mcp/servers/filesystem
    container_name: mcp_filesystem
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace
    restart: unless-stopped
    networks:
      - ai-net

  mcp_media:
    build:
      context: ../mcp/servers/media
    container_name: mcp_media
    environment:
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - COMFYUI_BASE_URL=http://192.168.4.55:8188
    volumes:
      - /home/chuck/data/media/generated:/home/chuck/data/media/generated
    restart: unless-stopped
    networks:
      - ai-net

  # --- Future MCP servers ---------------------------------------------------
  # mcp_presentation:
  #   build:
  #     context: ../mcp/servers/presentation
  #   container_name: mcp_presentation
  #   restart: unless-stopped
  #   networks:
  #     - ai-net

networks:
  ai-net:
    external: true
