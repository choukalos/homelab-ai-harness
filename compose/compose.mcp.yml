# Docker Compose for MCP (Model Context Protocol) server containers
# Each MCP server runs as a standalone container on the ai-net network.
# LiteLLM reaches them by service name over SSE (e.g. http://mcp_knowledge:8000/sse).

name: ai-mcp

services:

  mcp_knowledge:
    build:
      context: ../mcp/servers/knowledge
    container_name: mcp_knowledge
    # Run as chuck (uid/gid 1000): writes land in chuck-owned zones
    # (data/backups/kb, data/ai-kb/digests) — outputs must be chuck-owned.
    user: "1000:1000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      # KB rebuild (2026-08-29): full KB server (read + write). KB_API_KEY is
      # a global-`m` Qdrant JWT (sub=mcp-knowledge) — per-collection scoping
      # cannot cover on-the-fly kb_* collections (proven: Qdrant 403 on
      # collection create). The `kb_` prefix gate in code is the boundary.
      - KB_API_KEY=${KB_API_KEY}
      # LiteLLM for embeddings (768-dim nomic) + vision fallback (matrix-coder).
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - EMBED_MODEL=embeddings
      - VISION_MODEL=matrix-coder
      # Source-path allowlist for kb_ingest_file (container paths).
      - KB_ALLOWED_ROOTS=/data/media,/workspace,/data/ai-kb/raw
      # Writable backup target for kb_backup (host: /home/chuck/data/backups/kb).
      - KB_BACKUP_DIR=/backups/kb
      # Digest storage (host: /home/chuck/data/ai-kb/digests). Digests are a
      # higher-level model of a doc; file = source of truth, section facts go
      # into the source doc's KB.
      - DIGEST_DIR=/data/ai-kb/digests
      - DIGEST_HOST_DIR=/home/chuck/data/ai-kb/digests
      - QDRANT_TIMEOUT=60
    restart: unless-stopped
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/ai-kb/raw:/data/ai-kb/raw:ro
      - /home/chuck/data/media:/data/media:ro
      - /home/chuck/workspace:/workspace:ro
      - /home/chuck/data/backups/kb:/backups/kb:rw
      - /home/chuck/data/ai-kb/digests:/data/ai-kb/digests:rw

  mcp_search:
    build:
      context: ../mcp/servers/search
    container_name: mcp_search
    environment:
      - SEARXNG_URL=http://searxng:8080
      - SEARXNG_TIMEOUT=10
      # Pin healthy search engines (brave/duckduckgo/startpage are frequently
      # rate-limited / CAPTCHA-blocked from this instance). Adjust as engines recover.
      - SEARXNG_ENGINES=google,bing,mojeek
    restart: unless-stopped
    networks:
      - ai-net

  mcp_crawl:
    build:
      context: ../mcp/servers/crawl
    container_name: mcp_crawl
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
      # Required since crawl4ai binds all interfaces with token auth
      # (sent as Authorization: Bearer by server.py).
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    restart: unless-stopped
    networks:
      - ai-net

  mcp_filesystem_readonly:
    build:
      context: ../mcp/servers/filesystem_readonly
    container_name: mcp_filesystem_readonly
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace:ro
      - /home/chuck/data/media:/home/chuck/data/media:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_mysql:
    build:
      context: ../mcp/servers/mysql
    container_name: mcp_mysql
    # Run as chuck (uid/gid 1000): CSV output lands in data/media/csv.
    user: "1000:1000"
    environment:
      - MYSQL_HOST=thor.local
      - MYSQL_PORT=3306
      - MYSQL_USER=${AI_DB_USER}
      - MYSQL_PASSWORD=${AI_DB_PASS}
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=matrix-coder
      - CSV_OUTPUT_DIR=/home/chuck/data/media/csv
      # Allow analytical full-table scans for the business_analyst skill.
      # Other safety guards remain: MAX_ROWS_EXAMINED, MAX_JOIN_TABLES,
      # 500-row result cap, 30s timeout, SELECT-only.
      - BLOCK_FULL_TABLE_SCANS=false
    volumes:
      - /home/chuck/data/media/csv:/home/chuck/data/media/csv
      # Curated NL-to-SQL domain hints — mount so edits take effect on restart, no rebuild
      - ../mcp/servers/mysql/schema_hints.json:/app/schema_hints.json:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_homelab_status:
    build:
      context: ../mcp/servers/homelab_status
    container_name: mcp_homelab_status
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ai-net

  # --- New MCP servers -------------------------------------------------------

  mcp_filesystem:
    build:
      context: ../mcp/servers/filesystem
    container_name: mcp_filesystem
    # Run as chuck (uid/gid 1000): writes land in workspace/ (chuck-owned).
    user: "1000:1000"
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace
    restart: unless-stopped
    networks:
      - ai-net

  mcp_media:
    build:
      context: ../mcp/servers/media
    container_name: mcp_media
    # Run as chuck (uid/gid 1000): writes land in data/media/generated +
    # workspace/media (staging) — outputs must be chuck-owned.
    user: "1000:1000"
    environment:
      # GPU-host media-pipeline (2026-08-28): ComfyUI + VLLM + TTS/music/SFX
      # workers on Matrix. Thin HTTP client — no GPU work in this container.
      - MEDIA_PIPELINE_URL=http://192.168.4.55:8189
      - MEDIA_PIPELINE_FETCH_DIR=/home/chuck/data/media/generated/pipeline
      # Staging root for local-file inputs (media_put, trim/freeze/caption;
      # 2026-09-07). Scratch space — cleaned by scripts/cleanup-media-staging.sh
      # (MEDIA_STAGING_MAX_AGE_DAYS in .env, default 7d).
      - MEDIA_STAGING_DIR=/home/chuck/workspace/media
      # Public base for media_pull signed URLs (Caddy route, see Caddyfile).
      - MEDIA_PUBLIC_URL=https://siri.choukalos.com/media/pipeline
      # Identity threading (2026-07-09): caller's LiteLLM key (forwarded in
      # Authorization header when the call routes through LiteLLM) is resolved
      # to a user via /key/info and stamped on every job POST, so the
      # GPU-host pipeline can attribute work + cost per user. Fallback when
      # no Authorization header is present: MEDIA_USER (this deployment = chuck).
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - MEDIA_USER=chuck
      - MEDIA_CLIENT=pi
    volumes:
      - /home/chuck/data/media/generated:/home/chuck/data/media/generated
      - /home/chuck/workspace/media:/home/chuck/workspace/media
    restart: unless-stopped
    networks:
      - ai-net

  mcp_filebridge:
    build:
      context: ../mcp/servers/filebridge
    container_name: mcp_filebridge
    # Run as chuck (uid/gid 1000): writes land in the rw work-area /
    # publish-target mounts only (media staging, NAS store + published/,
    # blog public drop); the rest of data/media stays ro. P12-A/B/C
    # (SEC-12, 2026-11-26): the homelab's single public file edge. Minimal
    # env by design — NO LiteLLM/memory/master/API keys (env check is a
    # hard gate: docker inspect | grep -ciE 'litellm|memory|master|api_key'
    # must be 0). No host port: Caddy reaches it on ai-net (debug: docker
    # run --rm --network ai-net curlimages/curl -s
    # http://mcp_filebridge:8000/health). Kill switch: docker stop
    # mcp_filebridge kills the public file routes; Matrix untouched.
    user: "1000:1000"
    environment:
      - FILEBRIDGE_PORT=8000
      - MEDIA_PIPELINE_URL=http://192.168.4.55:8189
      - MEDIA_ROOT=/home/chuck/data/media
      # Mirrors Matrix MEDIA_UPLOAD_MAX_MB (default 500) — keep in sync if
      # Matrix's cap changes.
      - UPLOAD_MAX_MB=500
      - TZ=America/Chicago
    volumes:
      # P12-A: public serving root (MEDIA_ROOT) — the /media/files
      # allowlist is read-only.
      - /home/chuck/data/media:/home/chuck/data/media:ro
      # P12-B work areas (registry `work_areas` in filebridge.yaml; container
      # paths mirror host paths — the boot lint checks existence
      # in-container):
      # siri_outputs — remote_write:false (D13, siri-only): reads-only
      # suffice (nested over the ro data/media mount).
      - /home/chuck/data/media/siri_outputs:/home/chuck/data/media/siri_outputs:ro
      # media_staging — writable (file_pull/file_push destination; also
      # mcp_media's MEDIA_STAGING_DIR) — rw nested over the ro workspace
      # mount below.
      - /home/chuck/workspace/media:/home/chuck/workspace/media
      # nas_media_store — shared_output (D13) + the `nas` publish root
      # (/mnt/lego-media-store/published) — rw (host cifs automount;
      # registry `automount: true` = missing path is a lint warning, not an
      # error).
      - /mnt/lego-media-store:/mnt/lego-media-store
      # P12-C publish engine (POST /publish; the publish-file skill POSTs
      # here): the blog target root is WRITTEN by the engine (rw nested
      # over the ro data/media mount); the publish source_roots are READ
      # (workspace ro — the boot lint also requires source_roots to exist
      # in-container).
      - /home/chuck/data/media/public:/home/chuck/data/media/public
      - /home/chuck/workspace:/home/chuck/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ai-net

  mcp_vision:
    build:
      context: ../mcp/servers/vision
    container_name: mcp_vision
    # Run as chuck (uid/gid 1000): artifacts land in workspace/vision
    # (chuck-owned ephemeral zone).
    user: "1000:1000"
    environment:
      # Vision model via LiteLLM REST (alias as-is; thinking OFF in code).
      # Cap: 5 images per request (probed 2026-08-27) — server batches.
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - VISION_MODEL=matrix-coder
      # Artifacts: NON-public (no Caddy route). rw vision dir nested in the
      # ro workspace mount; sources read from media/ + ai-kb/raw/ (ro).
      # Ephemeral scratch — lives in the workspace zone (NOT data/).
      - VISION_OUTPUT_ROOT=/workspace/vision
      - VISION_ALLOWED_ROOTS=/data/media,/workspace,/data/ai-kb/raw
    volumes:
      - /home/chuck/workspace/vision:/workspace/vision
      - /home/chuck/data/media:/data/media:ro
      - /home/chuck/workspace:/workspace:ro
      - /home/chuck/data/ai-kb/raw:/data/ai-kb/raw:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_datahub:
    build:
      context: ../mcp/servers/datahub
    container_name: mcp_datahub
    # Thin REST wrapper over data-hub (ingest/loads/categorization review).
    # Inbox is read-only: data-hub owns the file lifecycle (moves to processed/).
    environment:
      - DATAHUB_URL=http://data-hub:8100
      - INBOX_DIR=/inbox
    volumes:
      - /home/chuck/data/finance/inbox:/inbox:ro
    restart: unless-stopped
    networks:
      - ai-net

  # --- Skills (cross-client skill discovery + execution) -------------------
  mcp_skills:
    build:
      context: ../mcp/servers/skills
    container_name: mcp_skills
    environment:
      # skill-runner (internal, :8091) — the skill executes server-side; the
      # client only ever reaches LiteLLM.
      - SKILL_RUNNER_URL=http://skill-runner:8091
      # Service key (fallback when no caller key is forwarded via the
      # Authorization header). MUST be a SINGLE key that is in skill-runner's
      # SKILL_RUNNER_API_KEY allow-list — the skill-runner does an exact-match
      # against its comma-split list, so a comma-joined value is rejected.
      - SKILL_RUNNER_API_KEY=${LITELLM_KEY_CHUCK}
      # run_skill blocks up to the skill's max_runtime; default wait budget.
      - SKILL_RUNNER_TIMEOUT=180
    restart: unless-stopped
    networks:
      - ai-net

  # --- Memory (Phase 11): per-user long-term memory retrieval --------------
  # Thin client over skill-runner's scoped endpoints (POST /api/memory/search,
  # POST /api/memory/list). Identity: caller's LiteLLM key forwarded via
  # Authorization (when routed through LiteLLM), else MEMORY_USER_KEY.
  # MEMORY_USER_KEY MUST be a SINGLE key in skill-runner's
  # SKILL_RUNNER_API_KEY allow-list (exact-match semantics). Cross-user
  # isolation is enforced server-side by skill-runner's IdentityResolver.
  mcp_memory:
    build:
      context: ../mcp/servers/memory
    container_name: mcp_memory
    environment:
      - SKILL_RUNNER_URL=http://skill-runner:8091
      # Fallback identity when the caller sends no Authorization header.
      # Serves Chuck's pi (Mac) deployment: resolves to user_id=chuck only.
      # Callers that DO send Authorization: Bearer <their LiteLLM key> are
      # forwarded to skill-runner and resolved per-user (dylan -> dylan, etc.).
      - MEMORY_USER_KEY=${LITELLM_KEY_CHUCK}
    # No host port mapping (Phase 4, security_todo, 2026-11-15): the former
    # 8005 LAN publish (F8: unauthenticated, fell back to Chuck's key) had no
    # LAN consumers (log check 2026-11-15: zero Mac traffic). LiteLLM reaches
    # it via ai-net DNS (mcp_memory:8000); Mac pi uses skill-runner /api/memory/*.
    restart: unless-stopped
    networks:
      - ai-net

  # --- Sessions (mcp_sessions Phase 1): remote session ingest + read-back --
  # Thin client over skill-runner's scoped session endpoints (POST
  # /api/sessions/ingest, GET /api/sessions/ingests, GET
  # /api/sessions/{session_id}). Identity: caller's LiteLLM key forwarded
  # via Authorization (when routed through LiteLLM), else SESSIONS_USER_KEY.
  # SESSIONS_USER_KEY MUST be a SINGLE key in skill-runner's
  # SKILL_RUNNER_API_KEY allow-list (exact-match semantics). Cross-user
  # isolation is enforced server-side by skill-runner's IdentityResolver
  # (owner-only read-back; admin key rejected on both routes).
  mcp_sessions:
    build:
      context: ../mcp/servers/sessions
    container_name: mcp_sessions
    environment:
      - SKILL_RUNNER_URL=http://skill-runner:8091
      # Fallback identity when the caller sends no Authorization header.
      # Serves Chuck's pi (Mac) deployment: resolves to user_id=chuck only.
      - SESSIONS_USER_KEY=${LITELLM_KEY_CHUCK}
      # ~30 ingests/user/hour (rolling window, in-memory per caller key).
      - SESSIONS_RATE_LIMIT=30
    # No host port mapping (MCP rule: LiteLLM-only surface). LiteLLM
    # reaches it via ai-net DNS (mcp_sessions:8000).
    restart: unless-stopped
    networks:
      - ai-net

  # --- Kanban (mcp_kanban): LLM task queue + grooming + execution ----------
  # Stateful service (not a thin client): Fastify GUI + REST + MCP
  # (streamable HTTP at /mcp) + in-process Pi agent sessions + orchestrator.
  # Web UI is LAN-only (bound to THOR_IP, no auth — LAN trust).
  # MySQL on Thor: DB ai_kanban pre-created (chuck), app runs table migrations.
  mcp_kanban:
    build:
      context: ../mcp/servers/kanban
    container_name: mcp_kanban
    # Run as chuck (uid/gid 1000): /data writes must be chuck-owned.
    user: "1000:1000"
    # Compose v5 project dir = compose/ (no .env there) — load the repo .env
    # explicitly so ${KANBAN_*} / ${LITELLM_API_KEY} interpolate (searxng pattern).
    env_file:
      - ../.env
    environment:
      # LiteLLM proxy (models + MCP tools) — internal ai-net URL.
      - LITELLM_BASE_URL=http://litellm-proxy:4000/v1
      # Service key: outbound LLM calls AND the "kanban key" (full MCP set).
      # Owner attribution: the kanban key stamps items with owner "kanban".
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      # Model + concurrency: .env-tunable (KANBAN_MODEL / KANBAN_MEDIA_CONCURRENT_TASKS /
      # KANBAN_NON_MEDIA_CONCURRENT_TASKS — per-category slots: media serialized,
      # non-media parallel).
      - MODEL=${KANBAN_MODEL:-matrix-coder}
      - MEDIA_CONCURRENT_TASKS=${KANBAN_MEDIA_CONCURRENT_TASKS:-1}
      - NON_MEDIA_CONCURRENT_TASKS=${KANBAN_NON_MEDIA_CONCURRENT_TASKS:-2}
      # git push auth (deploy stage) — unset until chuck provides it.
      - GITHUB_TOKEN=${KANBAN_GITHUB_TOKEN:-}
      # MySQL on Thor (DB pre-created; app runs migrations — tables only).
      - DB_DRIVER=mysql
      - MYSQL_HOST=${MYSQL_DB_HOST:-thor.local}
      - MYSQL_PORT=3306
      - MYSQL_USER=${KANBAN_DB_USER}
      - MYSQL_PASSWORD=${KANBAN_DB_PASS}
      - MYSQL_DATABASE=${KANBAN_DB_NAME}
      # Per-role thinking levels (app defaults).
      - GROOM_THINKING=xhigh
      - TASK_THINKING=medium
      - QA_THINKING=xhigh
      - SUMMARY_THINKING=medium
      # Caller-key scoping — ALIAS-keyed (Phase 13.3, 2026-11-26): entries are
      # USER_KEYS aliases (MEMORY_USER_KEYS members) resolved to the full
      # key at call time, so key rotation no longer requires a suffix swap
      # here.
      # Owner attribution is derived from USER_KEYS below (full-key match).
      - MCP_KEY_CAPABILITIES=${KANBAN_MCP_KEY_CAPABILITIES}
      # Per-user LLM spend attribution (Phase 2): sessions for work owned by
      # a user run against the proxy with that user's key (LiteLLM bills the
      # spend to the user's key/budget). Values may be ENV-VAR NAMES (the
      # template form of MEMORY_USER_KEYS) — resolved in-container at boot,
      # since the container carries the full .env. USER_KEYS also drives MCP
      # owner attribution (full-key match) and alias-keyed capability
      # entries (Phase 13.3). Single source of truth: agent stand-up
      # (key add-agent, Phase 13.5) needs no per-agent compose edit.
      - USER_KEYS=${MEMORY_USER_KEYS}
      # Workspace scratch sweep age (task-<id> / groom-<id> dirs; default 7).
      - WORKSPACE_CLEANUP_DAYS=7
    # LAN-only web UI (presenton pattern: LAN-IP bind, not 0.0.0.0).
    ports:
      - "${THOR_IP:-192.168.4.54}:3000:3000"
    volumes:
      - /home/chuck/data/ai-kanban:/data
      - /home/chuck/workspace:/workspace
      # Durable per-project file store (2026-11-23, remote client file
      # intake): client-staged task inputs (scripts, configs, ...) live here
      # as /files/<project_id>/ — retention unit is the PROJECT (icebox
      # items can wait months), so this is durable, NOT the transitory
      # workspace. Sibling of the app-state dir: in the backup scope, but
      # kept out of /data (migrations, kv, ...).
      - /home/chuck/data/ai-kanban-files:/files
      # Media project (2026-11-21): NAS media store (lego `workspace` share,
      # mounted on thor at /mnt/lego-media-store by scripts/setup-media-nas.sh;
      # /mnt, not /home/chuck/data — the data dir is backup scope) + the
      # blog's public file drop (served at choukalos.com/files/).
      - /mnt/lego-media-store:/media-store
      - /home/chuck/data/media/public:/publish
    restart: unless-stopped
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Future MCP servers ---------------------------------------------------
  # mcp_presentation:
  #   build:
  #     context: ../mcp/servers/presentation
  #   container_name: mcp_presentation
  #   restart: unless-stopped
  #   networks:
  #     - ai-net

networks:
  ai-net:
    external: true
