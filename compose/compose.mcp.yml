# Docker Compose for MCP (Model Context Protocol) server containers
# Each MCP server runs as a standalone container on the ai-net network.
# LiteLLM reaches them by service name (e.g. http://mcp_knowledge:8000/mcp).

name: ai-mcp

services:

  mcp_knowledge:
    build:
      context: ../mcp/servers/knowledge
    container_name: mcp_knowledge
    environment:
      - QDRANT_URL=http://qdrant:6333
      # KB rebuild (2026-08-29): full KB server (read + write). KB_API_KEY is
      # a global-`m` Qdrant JWT (sub=mcp-knowledge) — per-collection scoping
      # cannot cover on-the-fly kb_* collections (proven: Qdrant 403 on
      # collection create). The `kb_` prefix gate in code is the boundary.
      - KB_API_KEY=${KB_API_KEY}
      # LiteLLM for embeddings (768-dim nomic) + vision fallback (matrix-coder).
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - EMBED_MODEL=embeddings
      - VISION_MODEL=matrix-coder
      # Source-path allowlist for kb_ingest_file (container paths).
      - KB_ALLOWED_ROOTS=/data/media,/data/workspace,/data/ai-kb/raw
      # Writable backup target for kb_backup (host: /home/chuck/data/backups/kb).
      - KB_BACKUP_DIR=/backups/kb
      - QDRANT_TIMEOUT=60
    restart: unless-stopped
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/ai-kb/raw:/data/ai-kb/raw:ro
      - /home/chuck/data/media:/data/media:ro
      - /home/chuck/data/workspace:/data/workspace:ro
      - /home/chuck/data/backups/kb:/backups/kb:rw

  mcp_search:
    build:
      context: ../mcp/servers/search
    container_name: mcp_search
    environment:
      - SEARXNG_URL=http://searxng:8080
      - SEARXNG_TIMEOUT=10
    restart: unless-stopped
    networks:
      - ai-net

  mcp_crawl:
    build:
      context: ../mcp/servers/crawl
    container_name: mcp_crawl
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
    restart: unless-stopped
    networks:
      - ai-net

  mcp_filesystem_readonly:
    build:
      context: ../mcp/servers/filesystem_readonly
    container_name: mcp_filesystem_readonly
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace:ro
      - /home/chuck/data/media:/home/chuck/data/media:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_mysql:
    build:
      context: ../mcp/servers/mysql
    container_name: mcp_mysql
    environment:
      - MYSQL_HOST=thor.local
      - MYSQL_PORT=3306
      - MYSQL_USER=${AI_DB_USER}
      - MYSQL_PASSWORD=${AI_DB_PASS}
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=matrix-coder
      - CSV_OUTPUT_DIR=/home/chuck/data/media/csv
    volumes:
      - /home/chuck/data/media/csv:/home/chuck/data/media/csv
      # Curated NL-to-SQL domain hints — mount so edits take effect on restart, no rebuild
      - ../mcp/servers/mysql/schema_hints.json:/app/schema_hints.json:ro
    restart: unless-stopped
    networks:
      - ai-net

  mcp_homelab_status:
    build:
      context: ../mcp/servers/homelab_status
    container_name: mcp_homelab_status
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ai-net

  # --- New MCP servers -------------------------------------------------------

  mcp_filesystem:
    build:
      context: ../mcp/servers/filesystem
    container_name: mcp_filesystem
    volumes:
      - /home/chuck/workspace:/home/chuck/workspace
    restart: unless-stopped
    networks:
      - ai-net

  mcp_media:
    build:
      context: ../mcp/servers/media
    container_name: mcp_media
    environment:
      # GPU-host media-pipeline (2026-08-28): ComfyUI + VLLM + TTS/music/SFX
      # workers on Matrix. Thin HTTP client — no GPU work in this container.
      - MEDIA_PIPELINE_URL=http://192.168.4.55:8189
      - MEDIA_PIPELINE_FETCH_DIR=/home/chuck/data/media/generated/pipeline
    volumes:
      - /home/chuck/data/media/generated:/home/chuck/data/media/generated
    restart: unless-stopped
    networks:
      - ai-net

  mcp_vision:
    build:
      context: ../mcp/servers/vision
    container_name: mcp_vision
    environment:
      # Vision model via LiteLLM REST (alias as-is; thinking OFF in code).
      # Cap: 5 images per request (probed 2026-08-27) — server batches.
      - LITELLM_API_BASE=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - VISION_MODEL=matrix-coder
      # Artifacts: NON-public (no Caddy route). rw vision dir nested in the
      # ro workspace mount; sources read from media/ + ai-kb/raw/ (ro).
      - VISION_OUTPUT_ROOT=/data/workspace/vision
      - VISION_ALLOWED_ROOTS=/data/media,/data/workspace,/data/ai-kb/raw
    volumes:
      - /home/chuck/data/workspace/vision:/data/workspace/vision
      - /home/chuck/data/media:/data/media:ro
      - /home/chuck/data/workspace:/data/workspace:ro
      - /home/chuck/data/ai-kb/raw:/data/ai-kb/raw:ro
    restart: unless-stopped
    networks:
      - ai-net

  # --- Skills (cross-client skill discovery + execution) -------------------
  mcp_skills:
    build:
      context: ../mcp/servers/skills
    container_name: mcp_skills
    environment:
      # skill-runner (internal, :8091) — the skill executes server-side; the
      # client only ever reaches LiteLLM.
      - SKILL_RUNNER_URL=http://skill-runner:8091
      # Service key (fallback when no caller key is forwarded via the
      # Authorization header). Same value as skill-runner's SKILL_RUNNER_API_KEY.
      - SKILL_RUNNER_API_KEY=${SIRI_API_KEY},${LITELLM_KEY_CHUCK},${LITELLM_KEY_DYLAN}
      # run_skill blocks up to the skill's max_runtime; default wait budget.
      - SKILL_RUNNER_TIMEOUT=180
    restart: unless-stopped
    networks:
      - ai-net

  # --- Future MCP servers ---------------------------------------------------
  # mcp_presentation:
  #   build:
  #     context: ../mcp/servers/presentation
  #   container_name: mcp_presentation
  #   restart: unless-stopped
  #   networks:
  #     - ai-net

networks:
  ai-net:
    external: true
