name: ai-skill-runner

services:
  skill-runner:
    build:
      context: ../skills/runner
      dockerfile: Dockerfile
    image: skill-runner:local
    container_name: skill-runner
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${THOR_IP}:8091:8091"
    environment:
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - ARTIFACT_ROOT=/home/chuck/data/media
      - SKILL_RUNNER_LOG_DIR=/home/chuck/homelab/logs/skill_runner
      - SKILL_RUNNER_PORT=8091
      - SKILL_RUNNER_HOST=0.0.0.0
      - MCP_SERVER_SEARCH_URL=http://mcp_search:8000
      - MCP_SERVER_KNOWLEDGE_URL=http://mcp_knowledge:8000
      - MCP_SERVER_CRAWL_URL=http://mcp_crawl:8000
      - MCP_SERVER_FILESYSTEM_READONLY_URL=http://mcp_filesystem_readonly:8000
      - PYTHONUNBUFFERED=1
      - TZ=America/Chicago
      - HARNESS_URL=http://ai-harness:8090
    volumes:
      - ../skills:/app/skills:ro
      - /home/chuck/data/media:/home/chuck/data/media
      - /home/chuck/workspace:/home/chuck/workspace
      - /home/chuck/homelab/logs/skill_runner:/home/chuck/homelab/logs/skill_runner
    # Note: depends_on litellm is handled by homelab.sh run_ai_stack ordering
    # (AI_CORE starts before SKILL_RUNNER). Cross-project depends_on is not
    # supported by Docker Compose.
    networks:
      - ai-net
      - public-net

networks:
  ai-net:
    external: true
  public-net:
    external: true
