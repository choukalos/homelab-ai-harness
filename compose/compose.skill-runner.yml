name: ai-skill-runner

services:
  skill-runner:
    build:
      context: ../skills/runner
      dockerfile: Dockerfile
    image: skill-runner:local
    container_name: skill-runner
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${THOR_IP}:8091:8091"
    environment:
      - LITELLM_BASE_URL=http://litellm-proxy:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - ARTIFACT_ROOT=/home/chuck/data/media
      - SKILL_RUNNER_LOG_DIR=/home/chuck/homelab/logs/skill_runner
      - SKILL_RUNNER_PORT=8091
      - SKILL_RUNNER_HOST=0.0.0.0
      - MCP_SERVER_SEARCH_URL=http://mcp_search:8000
      - MCP_SERVER_KNOWLEDGE_URL=http://mcp_knowledge:8000
      - MCP_SERVER_CRAWL_URL=http://mcp_crawl:8000
      - MCP_SERVER_FILESYSTEM_READONLY_URL=http://mcp_filesystem_readonly:8000
      - MCP_SERVER_HOMELAB_STATUS_URL=http://mcp_homelab_status:8000
      - MCP_SERVER_FILESYSTEM_URL=http://mcp_filesystem:8000
      - MCP_SERVER_MEDIA_URL=http://mcp_media:8000
      - SKILL_RUNNER_API_KEY=${SIRI_API_KEY}
      - PYTHONUNBUFFERED=1
      - TZ=America/Chicago
      - HARNESS_URL=http://skill-runner:8091
      # ── Long-term memory (memory_todo.md Phase 2) ──────────────
      # In-process Mem0. Dedicated, model-restricted LiteLLM key (least
      # privilege). All values sourced from .env (gitignored).
      - MEMORY_ENABLED=${MEMORY_ENABLED}
      - MEMORY_RETRIEVAL_ENABLED=${MEMORY_RETRIEVAL_ENABLED}
      - MEMORY_WRITEBACK_ENABLED=${MEMORY_WRITEBACK_ENABLED}
      - MEMORY_MCP_ENABLED=${MEMORY_MCP_ENABLED}
      - MEMORY_HOUSEHOLD_ENABLED=${MEMORY_HOUSEHOLD_ENABLED}
      - MEMORY_DEBUG_LOGGING=${MEMORY_DEBUG_LOGGING}
      - MEMORY_LITELLM_BASE_URL=${MEMORY_LITELLM_BASE_URL}
      - MEMORY_LITELLM_KEY=${MEMORY_LITELLM_KEY}
      - MEMORY_QDRANT_URL=${MEMORY_QDRANT_URL}
      - MEMORY_COLLECTION=${MEMORY_COLLECTION}
      - MEMORY_EMBED_DIM=${MEMORY_EMBED_DIM}
      - MEMORY_TOP_K=${MEMORY_TOP_K}
      - MEMORY_TIMEOUT_MS=${MEMORY_TIMEOUT_MS}
      - MEMORY_WRITEBACK_TIMEOUT_MS=${MEMORY_WRITEBACK_TIMEOUT_MS}
      - MEMORY_MAX_CONTEXT_TOKENS=${MEMORY_MAX_CONTEXT_TOKENS}
      - MEMORY_EXTRACTION_MODEL=${MEMORY_EXTRACTION_MODEL}
      - MEM0_TELEMETRY=false
    volumes:
      - ../skills:/app/skills:ro
      - /home/chuck/data/media:/home/chuck/data/media
      - /home/chuck/workspace:/home/chuck/workspace
      - /home/chuck/homelab/logs/skill_runner:/home/chuck/homelab/logs/skill_runner
      - /home/chuck/homelab/data/scheduler:/app/data/scheduler
    # Note: depends_on litellm is handled by homelab.sh run_ai_stack ordering
    # (AI_CORE starts before SKILL_RUNNER). Cross-project depends_on is not
    # supported by Docker Compose.
    networks:
      - ai-net
      - public-net

networks:
  ai-net:
    external: true
  public-net:
    external: true
