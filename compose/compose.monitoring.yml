name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring-net
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    restart: unless-stopped
    networks:
      - monitoring-net
      - public-net
    ports:
      - "9090:8428"
      - "9091:8429"
    volumes:
      - ../prometheus/prometheus.yml:/etc/victoria-metrics/prometheus.yml:ro
      - /home/chuck/data/victoria-metrics:/victoria-metrics/data
    command:
      - '--promscrape.config=/etc/victoria-metrics/prometheus.yml'
      # Hot-reload the promscrape config when prometheus/prometheus.yml changes
      # (disabled by default in VictoriaMetrics). memory_todo.md Phase 8:
      # skill-runner /metrics job added to the scrape config.
      - '--promscrape.configCheckInterval=30s'
      - '--storageDataPath=/victoria-metrics/data'
      - '--retentionPeriod=1y'
      - '--dedup.minScrapeInterval=15s'
      - '--selfScrapeInterval=15s'
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "matrix:${MATRIX_IP:-192.168.4.55}"
      - "athena:${ATHENA_IP:-192.168.5.110}"
      - "lego:${LEGO_IP:-192.168.5.100}"
    user: "0:0"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "3001:3000"
    volumes:
      - /home/chuck/data/grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Frontend Analytics ───
  # Admin UI: LAN-only at http://192.168.4.54:8082
  # Script & API: public via Caddy at https://plausible.choukalos.com
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.0
    container_name: plausible
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    env_file:
      - ../.env
    networks:
      - monitoring-net
      - public-net
    ports:
      - "8082:8000"
    volumes:
      - plausible-app:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=https://plausible.choukalos.com
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY}
      - DATABASE_URL=postgresql://${PLAUSIBLE_DB_USER:-plausible}:${PLAUSIBLE_DB_PASS}@plausible-db:5432/${PLAUSIBLE_DB_NAME:-plausible}
      - CLICKHOUSE_DATABASE_URL=http://plausible-events-db:8123/plausible
      - DISABLE_REGISTRATION=true
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events-db:
        condition: service_healthy

  plausible-db:
    image: postgres:16-alpine
    container_name: plausible-db
    restart: unless-stopped
    networks:
      - monitoring-net
    environment:
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASS}
      POSTGRES_DB: plausible
    volumes:
      - /home/chuck/data/plausible-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible"]
      start_period: 1m

  plausible-events-db:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: plausible-events-db
    restart: unless-stopped
    networks:
      - monitoring-net
    volumes:
      - /home/chuck/data/plausible-events-db:/var/lib/clickhouse
      - /home/chuck/data/plausible-events-logs:/var/log/clickhouse-server
      - ../plausible/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ../plausible/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ../plausible/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ../plausible/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  # ─── Bare-metal MySQL Exporter ───
  # TODO: Re-enable once mysql-exporter config issue is resolved
  # The exporter requires a .my.cnf or DATA_SOURCE_NAME but the current
  # image (v0.15.1+) has config parsing issues with env_file.
  # mysql-exporter:
  #   image: prom/mysqld-exporter:v0.15.1
  #   container_name: mysql-exporter
  #   restart: unless-stopped
  #   env_file:
  #     - ../.env
  #   networks:
  #     - monitoring-net
  #   volumes:
  #     - ../mysql-exporter/.my.cnf:/root/.my.cnf:ro
  #   extra_hosts:
  #     - "thor.local:192.168.4.54"

networks:
  monitoring-net:
    driver: bridge
  public-net:
    external: true

volumes:
  plausible-app:
