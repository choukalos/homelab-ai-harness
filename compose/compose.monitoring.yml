name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring-net
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "9090:8428"
      - "9091:8429"
    volumes:
      - ../prometheus/prometheus.yml:/etc/victoria-metrics/prometheus.yml:ro
      - /home/chuck/data/victoria-metrics:/victoria-metrics/data
    command:
      - '--promscrape.config=/etc/victoria-metrics/prometheus.yml'
      - '--storageDataPath=/victoria-metrics/data'
      - '--retentionPeriod=1y'
      - '--dedup.minScrapeInterval=15s'
      - '--selfScrapeInterval=15s'
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "matrix:${MATRIX_IP:-192.168.4.55}"
      - "athena:${ATHENA_IP:-192.168.5.110}"
    user: "0:0"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "3001:3000"
    volumes:
      - /home/chuck/data/grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  monitoring-net:
    driver: bridge
