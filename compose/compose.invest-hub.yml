services:
  invest-hub-server:
    image: ghcr.io/choukalos/invest-hub-server:latest
    container_name: invest-hub-server
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - public-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=${INVEST_DB_NAME}
      - DATABASE_USER=${INVEST_DB_USER}
      - DATABASE_PASSWORD=${INVEST_DB_PASS}
      - PUBLIC_BASE_URL=https://invest.choukalos.com

  invest-hub-client:
    image: ghcr.io/choukalos/invest-hub-client:latest
    container_name: invest-hub-client
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - public-net
    depends_on:
      - invest-hub-server


