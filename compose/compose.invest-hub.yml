name: homelab-invest

services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    environment:
      - REPO_URL=https://github.com/choukalos/invest-hub
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      - RUNNER_NAME=invest-hub-runner
      - RUNNER_SCOPE=repo
      - RUNNER_WORKDIR=/tmp/runner/work
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner/data
      - DISABLE_AUTO_UPDATE=true
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
      - LABELS=self-hosted,linux,docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/chuck/data/invest-hub-runner:/runner/data
      - /tmp/runner:/tmp/runner
      - /home/chuck/homelab/compose:/home/github-runner/work/compose
      - /home/chuck/homelab/.env:/home/github-runner/work/.env
    networks:
      - public-net

  invest-hub-server:
    image: invest-hub-server:latest
    build:
      context: ../../workspace/code/invest-hub/server
      dockerfile: Dockerfile
    container_name: invest-hub-server
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.env
    networks:
      - public-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "thor.local:192.168.4.54"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - PUBLIC_BASE_URL=https://api.choukalos.com/
      - JWT_SECRET=${INVEST_JWT_SECRET}
      - YF_REQUEST_DELAY_MS=750
      - YF_REQUEST_JITTER_MS=750
      - YF_MAX_RETRIES=5
      - YF_RETRY_BASE_MS=2000
      - YF_RETRY_MAX_MS=30000
      - YF_SYMBOL_DELAY_MS=2000
      - YF_SYMBOL_JITTER_MS=1000
      - YF_RATE_LIMIT_COOLOFF_MS=45000
      - MAX_DAILY_SYMBOLS=2000
      - CORS_ORIGINS=https://invest.choukalos.com,https://api.choukalos.com
      - ADMIN_EMAIL=${INVEST_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${INVEST_ADMIN_PASSWORD}
      - TZ=${TZ}

  invest-hub-client:
    image: invest-hub-client:latest
    build:
      context: ../../workspace/code/invest-hub/client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_PLAUSIBLE_URL: https://plausible.choukalos.com
        VITE_PLAUSIBLE_DOMAIN: invest.choukalos.com
    container_name: invest-hub-client
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.env
    environment:
      - BACKEND_HOST=invest-hub-server
    networks:
      - public-net
    depends_on:
      - invest-hub-server

networks:
  public-net:
    external: true

    
