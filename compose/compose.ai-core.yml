name: ai-core

services:
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER:-litellm}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASS}
      - POSTGRES_DB=${LITELLM_DB_NAME:-litellm}
      - TZ=America/Chicago
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    # Phase 9 hardening (memory_todo.md D8): pinned off main-latest.
    image: ghcr.io/berriai/litellm:v1.104.0
    container_name: litellm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - OMLX_API_KEY=${OMLX_API_KEY}
      - DATABASE_URL=${LITELLM_DATABASE_URL}
      - MAC_STUDIO_IP=192.168.4.56
      - MATRIX_IP=192.168.4.55
      - THOR_IP=192.168.4.54
      - TZ=America/Chicago
    networks:
      - ai-net
    ports:
      # Phase 4 (security_todo, 2026-11-15): LAN-IP bind — litellm is not
      # public; LAN clients use 192.168.4.54:4000, containers use ai-net DNS.
      - "${THOR_IP:-192.168.4.54}:4000:4000"
    volumes:
      - ../litellm/config.yml:/app/config.yaml:ro
      - /home/chuck/data/litellm:/app/data
      - ../mcp:/home/chuck/homelab/mcp
    extra_hosts:
      - "macstudio:${MAC_STUDIO_IP:-127.0.0.1}"
      - "matrix:${MATRIX_IP:-127.0.0.1}"
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/metrics/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    # Phase 9 hardening: pinned off latest. v1.19.2 (bumped from v1.18.1 on
    # 2026-11-15, security_todo 9.3-V1 — LAN-only, no critical CVE; data on
    # the /home/chuck/data/qdrant bind mount, backup taken pre-bump).
    # Note: Qdrant tags carry a 'v' prefix (v1.19.2, not 1.19.2).
    image: qdrant/qdrant:v1.19.2
    container_name: qdrant
    restart: unless-stopped
    # Phase 9 least-privilege: enable API-key auth + JWT RBAC.
    #   - QDRANT__SERVICE__API_KEY = admin key (full access), ops/backup/seed only.
    #   - QDRANT__SERVICE__READ_ONLY_API_KEY = read-only key, used by mcp_knowledge.
    #   - JWT RBAC: skill-runner gets a per-collection scoped JWT (mem0_memories: rw),
    #     generated by scripts/qdrant-jwt.py (see docs/memory/IMPLEMENTATION_STATE.md).
    # First-boot constraint: a scoped JWT CANNOT create collections, so the
    # collection must pre-exist (it does); disaster recovery uses the admin key.
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_ADMIN_API_KEY}
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY}
      - QDRANT__SERVICE__JWT_RBAC=true
    networks:
      - ai-net
    ports:
      # Phase 4 (security_todo, 2026-11-15): THOR_IP bind instead of 0.0.0.0 —
      # host scripts (backup-*.sh, reembed-memory.py) need host access and use
      # 192.168.4.54:6333; containers use docker DNS (qdrant:6333). D9
      # (no TLS, LAN trust) unchanged.
      - "${THOR_IP:-192.168.4.54}:6333:6333"
    volumes:
      - /home/chuck/data/qdrant:/qdrant/storage

  ai-redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/redis:/data

  searxng:
    image: searxng/searxng@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    container_name: searxng
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - ai-net
    volumes:
      - /home/chuck/homelab/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - /home/chuck/data/searxng:/var/cache/searxng
    depends_on:
      - searxng-valkey

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    networks:
      - ai-net
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - /home/chuck/data/searxng-valkey:/data

  crawl4ai:
    image: unclecode/crawl4ai@sha256:9021b3cb5c6f12570bbcd5395638495e0a06969b3148e377b953d174af2ebc9b
    container_name: crawl4ai
    restart: unless-stopped
    networks:
      - ai-net
    shm_size: "3g"
    # Operator token: entrypoint refuses to bind non-loopback without a
    # credential (mcp_crawl needs to reach it over ai-net). Sent by
    # mcp_crawl as Authorization: Bearer. Rotate by changing .env + recreate.
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      - /home/chuck/data/crawl4ai:/app/data

  presenton:
    image: ghcr.io/presenton/presenton@sha256:ddf0d1f26397764856acdf94489dbbae5a2c0644a280723fd80bc7a80de338ba
    container_name: presenton
    restart: unless-stopped
    networks:
      - ai-net
    ports:
      # LAN-only (family use): bind to the LAN IP, not 0.0.0.0
      - "${THOR_IP}:5000:80"
    volumes:
      # NOTE (2026-11-21): the app runs as root in-container, so files it
      # creates are root-owned. `userConfig.json` (+ .bak) hold the auth
      # secret and are 600 root:root — which breaks the chuck-run backup
      # rsync (Permission denied). After any re-provision/recreate that
      # leaves them root-owned: docker exec presenton chown 1000:1000
      # /app_data/userConfig.json /app_data/userConfig.json.bak
      # (root in-container still reads/writes them; keep 600 — secret).
      - /home/chuck/data/presenton:/app_data
    environment:
      # Passwordless (auth_todo.md Phase 5.5): DISABLE_AUTH=true skips the
      # auth middleware entirely. LAN-only :5000. Manual step G: recreate.
      - DISABLE_AUTH=true
      - CAN_CHANGE_KEYS=false
      - LLM=custom
      - CUSTOM_LLM_URL=http://litellm-proxy:4000/v1
      - CUSTOM_LLM_API_KEY=${LITELLM_API_KEY}
      - CUSTOM_MODEL=${HARNESS_MODEL}
      - IMAGE_PROVIDER=pexels
      - SEARXNG_BASE_URL=http://searxng:8080
      - WEB_SEARCH_PROVIDER=searxng
      - DISABLE_ANONYMOUS_TRACKING=true
      - DISABLE_IMAGE_GENERATION=true
    depends_on:
      litellm:
        condition: service_healthy

networks:
  ai-net:
    external: true


