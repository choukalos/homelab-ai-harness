name: ai-core

services:
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER:-litellm}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASS}
      - POSTGRES_DB=${LITELLM_DB_NAME:-litellm}
      - TZ=America/Chicago
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    # Phase 9 hardening (memory_todo.md D8): pinned off main-latest.
    # v1.92.0 is the EXACT version running as of 2026-08-28 (verified in
    # container: litellm-1.92.0.dist-info) — zero version drift, just
    # removes the floating tag. Re-pin deliberately on future upgrades.
    image: ghcr.io/berriai/litellm:v1.92.0
    container_name: litellm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PUBLIC_API_KEY=${LITELLM_PUBLIC_API_KEY}
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - DATABASE_URL=${LITELLM_DATABASE_URL}
      - MAC_STUDIO_IP=192.168.4.56
      - MATRIX_IP=192.168.4.55
      - THOR_IP=192.168.4.54
      - TZ=America/Chicago
    networks:
      - ai-net
    ports:
      - "4000:4000"
    volumes:
      - ../litellm/config.yml:/app/config.yaml:ro
      - /home/chuck/data/litellm:/app/data
      - ../mcp:/home/chuck/homelab/mcp
    extra_hosts:
      - "macstudio:${MAC_STUDIO_IP:-127.0.0.1}"
      - "matrix:${MATRIX_IP:-127.0.0.1}"
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/metrics/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai-net
    ports:
      - "3000:8080"
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=False
      - ENABLE_PERSISTENT_CONFIG=False
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_API_URL=http://${MATRIX_IP}:8188
      - HARNESS_URL=http://skill-runner:8091
      - HARNESS_API_KEY=${HARNESS_API_KEY}
      - HARNESS_DISPLAY_URL=http://${THOR_IP:-192.168.4.54}:8091
    volumes:
      - /home/chuck/data/open-webui:/app/backend/data
    depends_on:
      - litellm

  qdrant:
    # Phase 9 hardening: pinned off latest. v1.18.1 is the EXACT version
    # running as of 2026-08-28 (verified via GET / → version 1.18.1).
    # Note: Qdrant tags carry a 'v' prefix (v1.18.1, not 1.18.1).
    image: qdrant/qdrant:v1.18.1
    container_name: qdrant
    restart: unless-stopped
    # Phase 9 least-privilege: enable API-key auth + JWT RBAC.
    #   - QDRANT__SERVICE__API_KEY = admin key (full access), ops/backup/seed only.
    #   - QDRANT__SERVICE__READ_ONLY_API_KEY = read-only key, used by mcp_knowledge.
    #   - JWT RBAC: skill-runner gets a per-collection scoped JWT (mem0_memories: rw),
    #     generated by scripts/qdrant-jwt.py (see docs/memory/IMPLEMENTATION_STATE.md).
    # First-boot constraint: a scoped JWT CANNOT create collections, so the
    # collection must pre-exist (it does); disaster recovery uses the admin key.
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_ADMIN_API_KEY}
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY}
      - QDRANT__SERVICE__JWT_RBAC=true
    networks:
      - ai-net
    ports:
      - "6333:6333"
    volumes:
      - /home/chuck/data/qdrant:/qdrant/storage

  ai-redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    networks:
      - ai-net
    volumes:
      - /home/chuck/data/redis:/data

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - ai-net
    ports:
      - "8088:8080"
    volumes:
      - /home/chuck/homelab/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - /home/chuck/data/searxng:/var/cache/searxng
    depends_on:
      - searxng-valkey

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    networks:
      - ai-net
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - /home/chuck/data/searxng-valkey:/data

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    networks:
      - ai-net
    ports:
      - "11235:11235"
    shm_size: "3g"
    volumes:
      - /home/chuck/data/crawl4ai:/app/data

  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: presenton
    restart: unless-stopped
    networks:
      - ai-net
    ports:
      - "5000:80"
    volumes:
      - /home/chuck/data/presenton:/app_data
    environment:
      - AUTH_USERNAME=presenton
      - AUTH_PASSWORD=${PRESENTON_AUTH_PASSWORD}
      - CAN_CHANGE_KEYS=false
      - LLM=custom
      - CUSTOM_LLM_URL=http://litellm-proxy:4000/v1
      - CUSTOM_LLM_API_KEY=${LITELLM_API_KEY}
      - CUSTOM_MODEL=${HARNESS_MODEL}
      - IMAGE_PROVIDER=pexels
      - SEARXNG_BASE_URL=http://searxng:8080
      - WEB_SEARCH_PROVIDER=searxng
      - DISABLE_ANONYMOUS_TRACKING=true
      - DISABLE_IMAGE_GENERATION=true
    depends_on:
      litellm:
        condition: service_healthy

networks:
  ai-net:
    external: true


