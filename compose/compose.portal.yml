# CHOUKALOS // HOMELAB — public portal (blog-todo.md B2).
#
#   git-sync : pulls the `deploy` branch of the Hugo repo into
#              /home/chuck/data/portal/git with an atomic `current` symlink.
#   portal   : stdlib-only static server (portal/server.py) serving the site,
#              the /files/ public drop zone, and /status/ runtime artifacts.
#   statusd  : stdlib-only status publisher (portal/statusd.py). Every 30s it
#              checks Victoria Metrics (litellm / node-exporter-lego /
#              cadvisor-lego homebridge) with direct-probe fallbacks and
#              atomically writes /status/status.json to the runtime dir.
#
# Caddy (compose.edge.yml) routes choukalos.com → portal:8080. The portal
# holds nothing sensitive: no secrets, no DB, no auth state, ro mounts.
# statusd is the only writer to the runtime dir; it has no published ports.
name: homelab-portal

services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.5.1
    container_name: portal-git-sync
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --repo=https://github.com/choukalos/homelab-blog
      - --ref=deploy
      - --root=/git
      - --link=current
      - --period=30s
    volumes:
      - /home/chuck/data/portal/git:/git
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - public-net

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    image: portal:local
    container_name: portal
    restart: unless-stopped
    depends_on:
      - git-sync
    environment:
      - PORTAL_PORT=8080
      - PORTAL_GIT_ROOT=/git
      - PORTAL_FILES_ROOT=/files
      - PORTAL_RUNTIME_ROOT=/runtime
      - TZ=America/Chicago
    volumes:
      # git-sync output (read the `current` symlink live per request)
      - /home/chuck/data/portal/git:/git:ro
      # curated public drop zone
      - /home/chuck/data/media/public:/files:ro
      # status artifacts (written by statusd)
      - /home/chuck/data/portal/runtime:/runtime:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, urllib.error, sys
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)
              sys.exit(0 if r.status < 500 else 1)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code < 500 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    expose:
      - "8080"
    networks:
      - public-net

  # statusd — the /status/ publisher (Option D sidecar).
  #
  #   Checks (Victoria Metrics first, direct probe as fallback):
  #     AI LAB      up{job="litellm"}                -> thor-lan:4000/health/liveliness
  #     MEDIA       up{job="node-exporter-lego"}     -> lego:9100/metrics
  #     AUTOMATION  cadvisor container_last_seen     -> lego:8581/login (homebridge)
  #     PUBLIC FILES always online (serving the file == portal is up)
  #
  #   Security: read-only rootfs, non-root (1000:1000), no published ports,
  #   no credentials — the only write is an atomic rename of status.json into
  #   the runtime dir (portal keeps the same dir mounted :ro). If it dies, the
  #   home page shows "stale — last update" after 5 min; `docker compose up -d
  #   statusd` recovers it.
  statusd:
    build:
      context: ../portal
      dockerfile: Dockerfile
    image: portal:local
    container_name: portal-statusd
    restart: unless-stopped
    depends_on:
      - git-sync
    user: "1000:1000"
    command: ["python3", "/app/statusd.py"]
    environment:
      - TZ=America/Chicago
      - INTERVAL_SECONDS=30
      - VM_URL=http://victoria-metrics:8428
      - THOR_LITELLM=http://thor-lan:4000
      - LEGO_IP=${LEGO_IP:-192.168.5.100}
      # Optional: homebridge container ID on lego (Container Station ->
      # homebridge -> ID). When set, AUTOMATION is checked via
      # container_last_seen in Victoria Metrics; otherwise the direct probe
      # (lego:8581/login) is used.
      - HOME_BRIDGE_ID=${HOME_BRIDGE_ID:-}
    extra_hosts:
      - "thor-lan:host-gateway"
      - "lego:${LEGO_IP:-192.168.5.100}"
    volumes:
      # git-sync output (read the `current` symlink for portal_revision)
      - /home/chuck/data/portal/git:/git:ro
      # the only writer to the runtime dir (portal keeps it :ro)
      - /home/chuck/data/portal/runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # healthy = status.json exists and was written within the last 5 min
      test:
        - CMD
        - python3
        - -c
        - |
          import os, time, sys
          p = '/runtime/status.json'
          sys.exit(0 if os.path.isfile(p) and time.time() - os.path.getmtime(p) < 300 else 1)
      interval: 60s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - public-net

networks:
  public-net:
    external: true
