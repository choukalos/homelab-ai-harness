name: homelab

networks:
  edge-net:
    name: edge-net
  public-net:
    name: public-net
  ai-net:
    name: ai-net

services:
  caddy:
    # Pinned: 2.11.6 had a regression (#8103) where the new 1-min idle read
    # deadline killed streaming responses (LLM SSE) exactly 60s after the
    # request body was read. Fixed in 2.11.7 (#8107). Bump deliberately.
    image: caddy:2.11.7
    container_name: caddy
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - edge-net
      - public-net
      - ai-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/chuck/homelab/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/chuck/data/caddy/data:/data
      - /home/chuck/data/caddy/config:/config


