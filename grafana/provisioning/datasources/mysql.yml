apiVersion: 1

# Read-only data-hub MySQL datasource for product/business KPI dashboards.
# Uses dh_reports (SELECT-only on finance/hub/reports) — see the data-hub
# provision.sh. The hub.* tables hold the generic datasets (e.g.
# hub.ds_plausible). Platform/service status stays on the Prometheus
# datasource; this one is for the data-hub (MySQL) product KPIs.
#
# DH_REPORTS_USER / DH_REPORTS_PASS are injected into the Grafana container
# env from homelab/.env (compose.monitoring.yml) and interpolated here.
datasources:
  - name: MySQL
    type: mysql
    access: proxy
    uid: mysql-datahub
    url: 192.168.4.54:3306
    database: hub
    user: ${DH_REPORTS_USER}
    secureJsonData:
      password: ${DH_REPORTS_PASS}
    jsonData:
      addr: 192.168.4.54
      port: 3306
      dbUser: ${DH_REPORTS_USER}
      dbName: hub
      sslMode: disabled
      connectTimeout: 10
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: false
    editable: true
    basicAuth: false
