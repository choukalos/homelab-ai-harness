model_list:
  - model_name: local-general
    litellm_params:
      model: openai/gemma-26b
      api_base: http://macstudio:1234/v1
      api_key: "not-needed"

  - model_name: local-fast
    litellm_params:
      model: openai/gemma-4b
      api_base: http://macstudio:1234/v1
      api_key: "not-needed"

  - model_name: embeddings
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://matrix:11434/v1
      api_key: "not-needed"

  - model_name: matrix-gemma4-moe
    litellm_params:
      model: openai/gemma4:26b
      api_base: http://matrix:11434/v1
      api_key: "not-needed"

  - model_name: matrix-coder
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://matrix:8000/v1
      api_key: "not-needed"


general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

litellm_settings:
  set_verbose: true
  drop_params: true


