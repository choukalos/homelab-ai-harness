# =====================================================================
# DRAFT — Fix metrics auth + add cache costs for litellm 1.92.0 (v2)
# =====================================================================
#
# Changes from live config.yml:
#   1. litellm_settings: added require_auth_for_metrics_endpoint: false
#      (MUST be under litellm_settings, NOT general_settings.
#       The proxy does setattr(litellm, key, value) for each key in
#       litellm_settings, and PrometheusAuthMiddleware reads
#       litellm.require_auth_for_metrics_endpoint.)
#   2. model_info on each model: added cache_creation_input_token_cost and
#      cache_read_input_token_cost (silences the register_model warnings)
#      Cache creation cost = same as input cost (writing to cache costs the same)
#      Cache read cost     = 10% of input cost (reading from cache is much cheaper)
#   3. Note: The register_model warnings for the shared backend keys
#      (openai/gemma-4b, etc.) may still appear at startup because the
#      router intentionally strips custom pricing from the shared backend
#      key to prevent cross-deployment pollution. Cache costs ARE tracked
#      per-deployment via model_id. This is a cosmetic-only warning.
#
# Review and apply:
#   cp litellm/draft/config.fix-cache-costs.yml litellm/config.yml
#   docker compose -f compose/compose.ai-core.yml restart litellm
# =====================================================================

model_list:

  # ─── Custom pricing for budget tracking ─────────────────────────
  # Self-hosted models have no real $ cost, so we set nominal pricing
  # so that key budgets actually work. At $0.000001/token:
  #   $1 budget  = ~1M tokens  (~3-5k chat turns with ~200-300 tokens each)
  #   $10 budget = ~10M tokens
  #   $100 budget = ~100M tokens
  # Embeddings are 10x cheaper since they're short vectors.
  # Adjust to taste — the real "cost" is just your GPU time.

  # -- Gemma-4b via LMStudio on Mac Studio M1 -----------------------
  - model_name: studio-gemma4-4b
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      cache_creation_input_token_cost: 0.000001
      cache_read_input_token_cost: 0.0000001
    litellm_params:
      model: openai/gemma-4b
      api_base: http://macstudio:1234/v1
      api_key: "not-needed"

  # ── Qwen3.6-27B via vLLM (port 8000) ─────────────────────────────
  - model_name: matrix-coder
    model_info:
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000045
      cache_creation_input_token_cost: 0.00000075
      cache_read_input_token_cost: 0.000000075
    litellm_params:
      model: openai/qwen36-27b
      api_base: http://matrix:8000/v1
      api_key: "unused"
      num_retries: 2

  - model_name: matrix-gemma4-moe
    model_info:
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.000002
      cache_creation_input_token_cost: 0.00000025
      cache_read_input_token_cost: 0.000000025
    litellm_params:
      model: ollama/gemma4:26b
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2
      extra_body:
        options:
          think: false

  # ── Nomic embed-text for embeddings ──────────────────────────────
  - model_name: embeddings
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      cache_creation_input_token_cost: 0.0000001
      cache_read_input_token_cost: 0.00000001
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
  set_verbose: true
  debug_level: "WARNING"
  # Required for LiteLLM to store MCP server definitions
  # in the database so the /mcp-rest endpoints can discover tools.
  store_model_in_db: true
  # MCP client timeout (seconds) — SSE connections need more time
  mcp_client_timeout: 30
  # Disable spend tracking — unnecessary for self-hosted homelab
  disable_spend_logs: true
  disable_spend_updates: true

litellm_settings:
  callbacks:
    - prometheus
  # ─── FIX: /metrics endpoint returning 401 ─────────────────────
  # In 1.84.0+ the /metrics endpoint is authenticated by default.
  # DISABLE_METRICS_AUTH env var is no longer honored.
  # MUST be here under litellm_settings, NOT general_settings.
  require_auth_for_metrics_endpoint: false

# ─── MCP Servers ───────────────────────────────────────────────────
# LiteLLM v1.54+ supports MCP natively via the mcp_servers key.
#
# NOTE: Per-key MCP access restrictions (allow_all_keys → scoped grants)
# are deferred to Phase 14.  For now both servers use allow_all_keys: true
# so all LiteLLM API keys can call all MCP tools.

mcp_servers:

  # ── Search (SearXNG) ─────────────────────────────────────────────
  mcp_search:
    transport: http
    url: http://mcp_search:8000/mcp
    allow_all_keys: true

  # ── Knowledge (Qdrant) ───────────────────────────────────────────
  mcp_knowledge:
    transport: http
    url: http://mcp_knowledge:8000/mcp
    allow_all_keys: true

  # ── Crawl (Crawl4AI) ─────────────────────────────────────────────
  mcp_crawl:
    transport: http
    url: http://mcp_crawl:8000/mcp
    allow_all_keys: true

  # ── Filesystem Readonly ─────────────────────────────────────────
  mcp_filesystem_readonly:
    transport: http
    url: http://mcp_filesystem_readonly:8000/mcp
    allow_all_keys: true
