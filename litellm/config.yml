# APPLIED 2026-11-21 — mcp_kanban registration (proposals/2026-11-21-tier2-mcp-kanban.md).
# The `mcp_kanban` entry under mcp_servers (14th server; transport: http —
# streamable HTTP, unlike the SSE servers) is live; proxy restarted manually
# 2026-11-21 (restart severs active proxy sessions). Verified: 110 proxy
# tools (94 + 16 kanban) + E2E tools/call with chuck/dylan/unknown keys.
# 2026-11-26: `mcp_filebridge` entry added under mcp_servers (P12-B, SEC-12;
# 15th server; streamable HTTP at /mcp) — CONFIG ONLY, not yet applied:
# takes effect at the litellm recreate in the P12-B/C deploy runbook
# (docs/filebridge_p12bc_deploy.md — restart severs active proxy sessions)
# + the family-mcp-full access-group update (PUT /v1/unified_access_group).
#
# LIVE since 2026-11-19 — tier1-litellm-model-config-pass (proposals/2026-11-19-tier1-litellm-model-config-pass.md)
# 2026-11-21: studio-gemma4-26b capability flags verified against the reloaded
# OMLX upstream (see model_info comment) — supports_function_calling/response_schema
# raised to true. Requires `docker compose -f compose/compose.ai-core.yml up -d litellm`
# to take effect (restart severs active proxy sessions — needs explicit approval).
# 2026-11-26: backup model swapped studio-gemma4-26b → studio-inkling-mini
# (Inkling-2-Mini-oQ4e-mtp; OMLX upgrade now key-gated — api_key ${OMLX_API_KEY}
# from .env). Capability flags re-probed live 2026-11-26: tool calls, json_schema,
# vision (VLM), native reasoning — all work. Same recreate command to take effect.
model_list:
  # -- Inkling-2-Mini via OMLX on Mac Studio M1 (Backup LLM) ----------------
  - model_name: studio-inkling-mini
    model_info:
      mode: chat
      # VERIFIED 2026-11-26 against the upgraded OMLX upstream
      # (macstudio:8000, /v1/models → 1048576 max_model_len, model_type vlm):
      #   - tool calling: WORKS (finish_reason tool_calls, well-formed call)
      #   - response_format json_schema: WORKS (schema-conformant JSON)
      #   - image_url content: WORKS (VLM — reasoning references image color)
      #   - native reasoning: reasoning_content present (reasoning model)
      #   - context: 128k input + 16k output = 144384 << 1048576 (conservative,
      #     valid; upstream headroom left for prompt+completion safety)
      max_input_tokens: 128000
      max_output_tokens: 16384
      supports_function_calling: true   # probed 2026-11-26
      supports_vision: true             # probed 2026-11-26 (VLM, image processed)
      supports_reasoning: true          # probed 2026-11-26 (reasoning_content)
      supports_response_schema: true    # probed 2026-11-26
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.000002
      cache_creation_input_token_cost: 0.000000025
      cache_read_input_token_cost: 0.0000000025
    litellm_params:
      model: openai/Inkling-2-Mini-oQ4e-mtp
      api_base: http://macstudio:8000/v1
      api_key: "os.environ/OMLX_API_KEY"
      num_retries: 2

  # ── Qwen3.6-27B via vLLM (port 8000) ─────────────────────────────
  - model_name: matrix-coder
    model_info:
      mode: chat
      # Cap max output at 32k. Without this, LiteLLM derives it from the
      # upstream vLLM max_model_len (196608) and clients (e.g. pi) pick up
      # a 192k output budget, which is nonsensical and breaks long-prompt
      # sessions (max_tokens + prompt > context window).
      max_input_tokens: 196608
      max_output_tokens: 32768
      # Capability tags — verified live via the proxy 2026-11-19 (re-probed
      # after the config incident):
      #   supports_function_calling:          tool call returned tool_calls
      #   supports_parallel_function_calling: 2 parallel tool calls in one turn
      #   supports_vision:                    solid-color + split-layout image
      #     tests passed — this deployment SEES images (not text-only)
      #   supports_reasoning:                 reasoning_content present (Qwen3
      #     thinking mode; vLLM emits reasoning tokens)
      #   supports_response_schema:           response_format json_schema honored
      #   supports_prompt_caching:            vLLM automatic prefix caching
      #     (vllm-0.30.0)
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_vision: true
      supports_reasoning: true
      supports_response_schema: true
      supports_prompt_caching: true
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000045
      cache_creation_input_token_cost: 0.000000075
      cache_read_input_token_cost: 0.0000000075
    litellm_params:
      model: openai/qwen38-27b
      api_base: http://matrix:8000/v1
      api_key: "unused"
      num_retries: 2
      # Make the "Backup LLM" real: fail over to inkling when matrix vLLM is
      # down. enable_pre_call_checks (router_settings) skips the dead
      # deployment while OMLX is down, so this is inert until macstudio:8000
      # is back (tier1-macstudio-omlx-restart). Caveat: cross-model fallback
      # changes behavior (homelab availability > model fidelity — accepted).
      # Fallback is router-level (router_settings.fallbacks below) — per-entry
      # `fallbacks:` was removed 2026-11-26: the per-entry mechanism resolves
      # fallbacks via a direct litellm.acompletion() call that bypasses the
      # router, so group aliases (matrix-coder, studio-inkling-mini) fail
      # with "LLM Provider NOT provided" and the caller gets a 500.

  # ── Qwen3.6-27B, thinking OFF — fast mode for straightforward tasks ──
  # Qwen3 thinking is BINARY (reasoning_effort is ignored by the model): a
  # session running PI_REASONING_LEVEL=off still billed 2.57M reasoning
  # tokens (~$11.60) on matrix-coder (2026-11-17). enable_thinking:false is
  # verified end-to-end via client extra_body (0 reasoning tokens vs 52–53
  # baseline). Config-level extra_body is documented for LiteLLM — confirm
  # with one test request after the next proxy restart: usage.
  # completion_tokens_details.reasoning_tokens should be 0.
  - model_name: matrix-coder-fast
    model_info:
      mode: chat
      max_input_tokens: 196608
      max_output_tokens: 32768
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_vision: true
      supports_reasoning: false       # thinking is baked off for this alias
      supports_response_schema: true
      supports_prompt_caching: true
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000045
      cache_creation_input_token_cost: 0.000000075
      cache_read_input_token_cost: 0.0000000075
    litellm_params:
      model: openai/qwen38-27b
      api_base: http://matrix:8000/v1
      api_key: "unused"
      num_retries: 2
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── Gemma 4 31B — GPU 1 copywriter (Ollama, Matrix) ───────────
  # XOR-tenant with the media GPU workers: the pipeline's VRAM headroom
  # guard (media-pipeline/server.py _ensure_vram_headroom) evicts Ollama
  # when a media job needs VRAM; OLLAMA_KEEP_ALIVE=5m idle-unloads; the
  # first request after an unload triggers a ~46 s on-demand load (hence
  # timeout 180). If the model can't load (GPU 1 media-held, or hot
  # ComfyUI ~18 GB), the per-entry fallback routes the request to
  # matrix-coder instead of erroring. Manual override (Matrix):
  # `model-manager gpu1 swap {media|copywriter}`.
  # Added 2026-11-25 via POST /model/new (zero-downtime, no proxy
  # restart) + this file for persistence — plan:
  # thor_copywriter_litellm_plan.md. Capability tags deliberately absent:
  # config convention is verified-only tags (probe live before tagging).
  - model_name: matrix-copywriter
    model_info:
      mode: chat
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
    litellm_params:
      model: ollama/gemma4:31b
      api_base: http://matrix:11434
      api_key: "unused"
      timeout: 180
      # No num_retries: global router num_retries is 0 → the fallback fires
      # on the FIRST failure (a load that can't fit in VRAM fails fast
      # instead of burning a ~46 s doomed retry).
      # Fallback is router-level (router_settings.fallbacks below), NOT
      # per-entry — see the matrix-coder note: per-entry `fallbacks:` with a
      # group alias bypasses the router and 500s the caller (verified live
      # 2026-11-26; the router-level fallback is the working mechanism).

  # ── Nomic embed-text — mcp_knowledge (KB search/digests;
  #    EMBED_MODEL=embeddings in compose.mcp.yml) ──
  - model_name: embeddings
    model_info:
      mode: embedding
      max_input_tokens: 8192          # nomic-embed-text context
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      cache_creation_input_token_cost: 0.0000001
      cache_read_input_token_cost: 0.0000001
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2
      drop_params: true

  # ── Nomic embed-text — long-term memory (Mem0 via skill-runner).
  #    Versioned alias: a model swap must NOT mix old/new vector spaces. ──
  - model_name: homelab-embedding-v1
    model_info:
      mode: embedding
      max_input_tokens: 8192          # nomic-embed-text context
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      cache_creation_input_token_cost: 0.0000001
      cache_read_input_token_cost: 0.0000001
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2
      drop_params: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
  debug_level: "WARNING"
  store_model_in_db: true
  mcp_client_timeout: 30
  disable_spend_logs: false
  disable_spend_updates: false

litellm_settings:
  callbacks:
    - prometheus
  require_auth_for_metrics_endpoint: false

router_settings:
  enable_pre_call_checks: true
  num_retries: 0
  # Router-level model-group fallbacks (the working mechanism — verified
  # live 2026-11-26: dead-upstream request to a copywriter twin returned a
  # 200 served by qwen38-27b in 0.5 s, no 5xx to the caller). Per-entry
  # `fallbacks:` does NOT work for group aliases (bypasses the router —
  # "LLM Provider NOT provided"); do not reintroduce it. Applied at startup
  # via Router(**router_settings); runtime equivalent: POST /fallback.
  fallbacks:
    - matrix-copywriter:
        - matrix-coder
    - matrix-coder:
        - studio-inkling-mini

mcp_servers:
  mcp_search:
    transport: sse
    url: http://mcp_search:8000/sse
    timeout: 7200

  mcp_knowledge:
    transport: sse
    url: http://mcp_knowledge:8000/sse
    timeout: 7200

  mcp_crawl:
    transport: sse
    url: http://mcp_crawl:8000/sse
    timeout: 7200

  mcp_filesystem_readonly:
    transport: sse
    url: http://mcp_filesystem_readonly:8000/sse
    timeout: 7200

  mcp_mysql:
    transport: sse
    url: http://mcp_mysql:8000/sse
    timeout: 7200

  mcp_datahub:
    transport: sse
    url: http://mcp_datahub:8000/sse
    timeout: 7200

  mcp_homelab_status:
    transport: sse
    url: http://mcp_homelab_status:8000/sse
    timeout: 7200

  mcp_filesystem:
    transport: sse
    url: http://mcp_filesystem:8000/sse
    timeout: 7200

  mcp_media:
    transport: sse
    url: http://mcp_media:8000/sse
    timeout: 7200

  mcp_vision:
    transport: sse
    url: http://mcp_vision:8000/sse
    timeout: 7200

  mcp_memory:
    transport: sse
    url: http://mcp_memory:8000/sse
    timeout: 7200

  mcp_sessions:
    transport: sse
    url: http://mcp_sessions:8000/sse
    extra_headers:
      - Authorization
    timeout: 7200

  mcp_skills:
    transport: sse
    url: http://mcp_skills:8000/sse
    extra_headers:
      - Authorization
    timeout: 7200

  # mcp_kanban — LLM task queue + grooming + execution (14th server,
  # 2026-11-21). Streamable HTTP (transport: http) at POST /mcp — the only
  # non-SSE MCP entry; verified supported in LiteLLM v1.104.0
  # (MCPTransport = {sse, http, stdio}). Caller key forwarded via
  # Authorization for per-key tool scoping (MCP_KEY_CAPABILITIES in the
  # container: chuck=admin, dylan=control). Tools surface BARE (native
  # names, e.g. list_projects — no server prefix; same as the other 13
  # servers). Discovery (initialize/tools/list/ping) is unauthenticated
  # so the proxy's registry handshake works; tools/call requires a valid
  # Bearer key. NOTE: the family-mcp-full access group (07c1acf8-...) must
  # include mcp_kanban for the chuck/dylan keys (default-deny per-key MCP
  # access) — updated 2026-11-21.
  mcp_kanban:
    transport: http
    url: http://mcp_kanban:3000/mcp
    extra_headers:
      - Authorization
    timeout: 7200

  # mcp_filebridge — the homelab's single public file edge (P12-B, SEC-12,
  # 2026-11-26). 15th server; streamable HTTP (transport: http) at POST
  # /mcp — same shape as mcp_kanban. Tools surface BARE (file_pull /
  # file_push / file_publish / file_work_areas / file_targets — no server
  # prefix). Decision 3a: the face has no auth of its own — the proxy key
  # gate (access groups) decides which keys see the tools; the bridge
  # registry enforces per-area rules regardless of caller. CONFIG ONLY
  # (added 2026-11-26): takes effect at the litellm recreate in the P12-B/C
  # deploy runbook (docs/filebridge_p12bc_deploy.md — restart severs active
  # proxy sessions; user timing). The family-mcp-full access group
  # (07c1acf8-...) must be extended with mcp_filebridge for the chuck/dylan
  # keys (PUT /v1/unified_access_group/<id> — **executed 2026-11-27**;
  # per-key MCP access is group-granted, default-deny).
  mcp_filebridge:
    transport: http
    url: http://mcp_filebridge:8000/mcp
    extra_headers:
      - Authorization
    timeout: 7200

