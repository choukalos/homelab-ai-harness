# ─── Model → MCP Tool Bindings ───────────────────────────────────────
#
# Each model definition declares which MCP tools are available.
# The tool bundles (see tool-bundles.example.yaml) group these for
# per-key restrictions.
#
# When you apply this config, uncomment the `tools` blocks for each
# model and map them to the tool bundles you want active.
#
# Example for a model that should have search + knowledge:
#
#   - model_name: local/qwen-long
#     model_info:
#       input_cost_per_token: 0.000001
#       output_cost_per_token: 0.000001
#     litellm_params:
#       model: openai/qwen36-27b
#       api_base: http://matrix:8000/v1
#       api_key: "unused"
#     dynamic_parameters:
#       tool_choice: auto
#       tools:
#         - mcp_server: mcp_search
#           tools:
#             - search_web
#             - search_recent
#             - search_news
#         - mcp_server: mcp_knowledge
#           tools:
#             - kb_search
#             - kb_get_document
#             - kb_list_collections

# ─── Key → Tool Bundle Mappings ────────────────────────────────────
#
# Per-key tool restrictions are enforced by LiteLLM's user/team system.
# Since we keep it simple (no teams), use model aliases + key policies.
#
# Key        | Tool Bundle        | MCP Servers
# ───────────|────────────────────|────────────────────────────
# chuck      | bundle_admin       | All MCP servers
# son        | bundle_coding      | search, filesystem, knowledge (read)
# openwebui  | bundle_family      | search, knowledge (read)
# siri       | bundle_siri        | search, knowledge (read)
# automation | bundle_research    | search, knowledge (read), homelab_status

# ─── Rules ──────────────────────────────────────────────────────────
#
# 1. Do NOT copy this into the live LiteLLM config without review.
# 2. Test with a throwaway key first.
# 3. Verify MCP servers start and respond before binding to models.
# 4. Start with mcp_search only (lowest risk) and add more incrementally.
# 5. Monitor tool call latency and error rates after activation.
