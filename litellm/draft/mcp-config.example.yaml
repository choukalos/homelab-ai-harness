# LiteLLM MCP Tool Configuration — DRAFT
#
# Phase 10 — Do NOT copy into the live LiteLLM config.
# This registers MCP servers so LiteLLM can proxy tool calls to them.
# Manual review and Chuck's approval required before applying.
#
# Reference: docs/thor_mcp_architecture.md
#
# How LiteLLM uses this:
#   - Each model definition can reference a `dynamic_parameters` block with
#     `tool_choice` and `tools` that map to MCP server tool names.
#   - The MCP servers run as separate processes (stdio or SSE) on Thor.
#   - LiteLLM discovers the tools and routes calls through the MCP protocol.
#
# ─── MCP Server Definitions ─────────────────────────────────────────────
#
# Each MCP server is defined with its command, transport, and tools.
# LiteLLM 1.54+ supports MCP natively via the `mcp_servers` top-level key.

mcp_servers:

  # ── Search (SearXNG) ─────────────────────────────────────────────
  # Read-only web search. Lowest risk, broadly useful.
  - name: mcp_search
    command:
      - python3
      - /home/chuck/homelab/mcp/servers/search/server.py
    transport: stdio
    env:
      SEARXNG_URL: "http://searxng:8080"
      SEARXNG_TIMEOUT: "10"
    tools:
      - search_web
      - search_recent
      - search_news

  # ── Knowledge (Qdrant) ───────────────────────────────────────────
  # Read-only KB retrieval with curated collection allowlist.
  - name: mcp_knowledge
    command:
      - python3
      - /home/chuck/homelab/mcp/servers/knowledge/server.py
    transport: stdio
    env:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_TIMEOUT: "15"
    tools:
      - kb_search
      - kb_get_document
      - kb_list_collections
      - kb_recent_changes

