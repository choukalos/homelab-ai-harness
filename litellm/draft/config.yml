# LiteLLM Configuration — Phase 10 Draft
#
# DO NOT copy this into the live config without review.
# This file is the Phase 10 draft for applying MCP server registration
# to the LiteLLM proxy.  It is based on your current live config.yml
# with these added changes:
#
#   1. `store_model_in_db: true` in general_settings (required for MCP)
#   2. `mcp_servers:` section at the bottom (stdio servers)
#
# Keep your existing litellm/config.yml as-is until you've reviewed and
# applied the changes manually. See the Phase 10 manual steps below.

model_list:

  # ─── Custom pricing for budget tracking ─────────────────────────
  # Self-hosted models have no real $ cost, so we set nominal pricing
  # so that key budgets actually work. At $0.000001/token:
  #   $1 budget  = ~1M tokens  (~3-5k chat turns with ~200-300 tokens each)
  #   $10 budget = ~10M tokens
  #   $100 budget = ~100M tokens
  # Embeddings are 10x cheaper since they're short vectors.
  # Adjust to taste — the real "cost" is just your GPU time.

  # -- Gemma-4b via LMStudio on Mac Studio M1 -----------------------
  - model_name: studio-gemma4-4b
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
    litellm_params:
      model: openai/gemma-4b
      api_base: http://macstudio:1234/v1
      api_key: "not-needed"

  # ── Qwen3.6-27B via vLLM (port 8000) ─────────────────────────────
  - model_name: matrix-coder
    model_info:
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000045
    litellm_params:
      model: openai/qwen36-27b
      api_base: http://matrix:8000/v1
      api_key: "unused"
      num_retries: 2

  - model_name: matrix-gemma4-moe
    model_info:
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.000002
    litellm_params:
      model: ollama/gemma4:26b
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2
      extra_body:
        options:
          think: false

  # ── Nomic embed-text for embeddings ──────────────────────────────
  - model_name: embeddings
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://matrix:11434
      api_key: "unused"
      num_retries: 2

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
  set_verbose: true
  debug_level: "WARNING"
  # NEW (Phase 10) — Required for LiteLLM to store MCP server definitions
  # in the database so the /mcp-rest endpoints can discover tools.
  store_model_in_db: true

# Added to get token data into prometheus
litellm_settings:
  callbacks:
    - prometheus

# ─── MCP Servers ───────────────────────────────────────────────────
# LiteLLM v1.54+ supports MCP natively via the mcp_servers key.
# Each server is defined as a map entry with command, args, transport,
# and env.
#
# Start with mcp_search only.  Uncomment mcp_knowledge after search
# is verified working.
#
# NOTE: Per-key MCP access restrictions (allow_all_keys → scoped grants)
# are deferred to Phase 14.  For now both servers use allow_all_keys: true
# so all LiteLLM API keys can call all MCP tools.

mcp_servers:

  # ── Search (SearXNG) ─────────────────────────────────────────────
  # Read-only web search. Lowest risk.
  # Tools: search_web, search_recent, search_news
  # Used by: deep_research skill (Phase 9), siri_ask (Phase 9)
  mcp_search:
    command: python3
    args:
      - /home/chuck/homelab/mcp/servers/search/server.py
    transport: stdio
    env:
      SEARXNG_URL: "http://searxng:8080"
      SEARXNG_TIMEOUT: "10"
    allow_all_keys: true

  # ── Knowledge (Qdrant) ───────────────────────────────────────────
  # Read-only KB retrieval with curated collection allowlist.
  # Tools: kb_search, kb_get_document, kb_list_collections, kb_recent_changes
  # Used by: deep_research skill (Phase 9), presentation_build (Phase 9)
  # NOTE: Needs qdrant_client in the LiteLLM container. This server runs
  # in stdio mode for Phase 10; it will be containerized in Phase 15.
  mcp_knowledge:
    command: python3
    args:
      - /home/chuck/homelab/mcp/servers/knowledge/server.py
    transport: stdio
    env:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_TIMEOUT: "15"
    allow_all_keys: true

  # ── Future servers (commented out for later) ──────────────────────
  # mcp_crawl:
  #   command: python3
  #   args:
  #     - /home/chuck/homelab/mcp/servers/crawl/server.py
  #   transport: stdio
  #   env:
  #     CRAWL4AI_URL: "http://crawl4ai:11235"
  #
  # mcp_filesystem_readonly:
  #   command: python3
  #   args:
  #     - /home/chuck/homelab/mcp/servers/filesystem_readonly/server.py
  #   transport: stdio
