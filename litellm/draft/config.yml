# =====================================================================
# Phase 10 — Manual Steps for Chuck
# =====================================================================
#
# IMPORTANT: Per-key MCP access restrictions (replacing allow_all_keys
# with scoped grants) are deferred to Phase 14.  This Phase 10 config
# uses allow_all_keys: true on both servers for development.
#
# Steps to apply this config:
#
# 1. BACK UP YOUR CURRENT CONFIG
#    cp /home/chuck/homelab/litellm/config.yml /home/chuck/homelab/litellm/config.yml.bak
#
# 2. COMPARE THIS DRAFT WITH YOUR LIVE CONFIG
#    diff /home/chuck/homelab/litellm/config.yml /home/chuck/homelab/litellm/draft/config.yml
#    The only changes from your live config:
#      - store_model_in_db: true in general_settings
#      - mcp_servers: section at the bottom
#
# 3. ENSURE MCP SERVER FILES EXIST AND ARE WORKING
#    The stdio servers need their Python files on disk inside the
#    LiteLLM container. Your current ai-core compose already mounts
#    the mcp/ directory. Verify:
#      docker exec litellm-proxy ls /home/chuck/homelab/mcp/servers/search/server.py
#      docker exec litellm-proxy ls /home/chuck/homelab/mcp/servers/knowledge/server.py
#
# 4. ENSURE qdrant_client IS AVAILABLE
#    mcp_knowledge needs the qdrant_client Python package. In stdio
#    mode (Phase 10) it uses its own .venv under
#    /home/chuck/homelab/mcp/servers/knowledge/.venv which is already
#    built. In Phase 15 this will be containerized with its own
#    isolated environment.
#
# 5. COPY THE DRAFT CONFIG TO LIVE
#    cp /home/chuck/homelab/litellm/draft/config.yml /home/chuck/homelab/litellm/config.yml
#
# 6. RESTART THE LITELLM CONTAINER
#    cd /home/chuck/homelab
#    docker compose -f compose/compose.ai-core.yml restart litellm-proxy
#
# 7. VALIDATE MCP TOOLS ARE DISCOVERABLE
#    Replace YOUR_API_KEY with your actual LiteLLM API key.
#
#    # List available tools:
#    curl -s -H "Authorization: Bearer YOUR_API_KEY" \
#      http://localhost:4000/mcp-rest/tools/list | python3 -m json.tool
#
#    # Test search_web:
#    curl -s -X POST -H "Authorization: Bearer YOUR_API_KEY" \
#      -H "Content-Type: application/json" \
#      -d '{"tool":"search_web","arguments":{"query":"test","max_results":3}}' \
#      http://localhost:4000/mcp-rest/tools/call | python3 -m json.tool
#
# 8. VALIDATE EXISTING SERVICES STILL WORK
#    - Open WebUI should still load and chat
#    - llm.choukalos.com should still work
#    - siri.choukalos.com should still work
#    - Existing model aliases (matrix-coder, etc.) should still resolve
#
# 9. TEST THE SKILL RUNNER (if running)
#    If you've already started the skill-runner container:
#      docker compose -f compose/compose.skill-runner.yml up -d skill-runner
#
#    Test deep_research:
#      curl -X POST http://localhost:8091/skills/deep_research \
#        -H "Content-Type: application/json" \
#        -d '{"params":{"query":"test query"},"dry_run":true}'
#
#    Test siri_ask:
#      curl -X POST http://localhost:8091/skills/siri_ask \
#        -H "Content-Type: application/json" \
#        -d '{"params":{"query":"hello"},"dry_run":true}'
#
# ROLLBACK:
#    If anything breaks:
#      cp /home/chuck/homelab/litellm/config.yml.bak /home/chuck/homelab/litellm/config.yml
#      docker compose -f compose/compose.ai-core.yml restart litellm-proxy
#
