# ─── Bundle: admin ─────────────────────────────────────────────────
#
# Chuck-only. Full access to all tools.
#
bundle_admin:
  description: "Full admin access to all MCP tools"
  allowed_users:
    - chuck
  allowed_channels:
    - cli
    - pi
    - openwebui
    - ide
    - n8n
  model_aliases:
    - local/qwen-coder
    - local/qwen-long
    - local/gemma-family
    - local/experiment
    - local/embed
