# LiteLLM Tool Bundles — DRAFT
#
# Phase 10 — Do NOT copy into the live LiteLLM config.
# Each bundle groups MCP tools for a specific use case and channel.
# Manual review and Chuck's approval required before applying.
#
# Reference: docs/thor_mcp_architecture.md, docs/thor_channels_architecture.md
#
# How it works:
#   - A tool bundle is a named set of MCP tools.
#   - Each LiteLLM API key is mapped to one or more bundles.
#   - The skill runner declares which bundle it needs for a given skill.
#   - LiteLLM enforces that only bundled tools are available for that key.

# ─── Bundle: family ────────────────────────────────────────────────
#
# Safe for family use. Chat + basic knowledge lookup only.
# No admin tools, no filesystem, no crawling.
#
bundle_family:
  description: "Family-safe chat and knowledge lookup"
  allowed_users:
    - chuck
    - wife
    - daughter
  allowed_channels:
    - openwebui
    - portal
  model_aliases:
    - local/gemma-family
    - local/qwen-long
  tools:
    - name: kb_search
      mcp_server: mcp_knowledge
      description: "Search curated knowledge base"
    - name: kb_list_collections
      mcp_server: mcp_knowledge
      description: "List available knowledge collections"
    - name: kb_get_document
      mcp_server: mcp_knowledge
      description: "Retrieve a full document by ID"
  disallowed_tools:
    - "*"  # Explicitly block everything not listed above

# ─── Bundle: coding ────────────────────────────────────────────────
#
# For Chuck and son coding workflows.
# Includes search, filesystem read, and knowledge.
#
bundle_coding:
  description: "Coding tools — search, filesystem, knowledge"
  allowed_users:
