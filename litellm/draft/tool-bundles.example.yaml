# ─── Bundle: siri ──────────────────────────────────────────────────
#
# Narrow facade for Siri / iOS Shortcuts.
# Search + knowledge read only. Short responses.
#
bundle_siri:
  description: "Siri skill facade — search and knowledge only"
  allowed_users:
    - chuck
    - wife
    - daughter
  allowed_channels:
    - siri
  model_aliases:
    - local/qwen-coder
    - local/gemma-family
  tools:
    - name: search_web
      mcp_server: mcp_search
      description: "General web search"
    - name: kb_search
      mcp_server: mcp_knowledge
      description: "Search curated knowledge base"
    - name: kb_get_document
      mcp_server: mcp_knowledge
