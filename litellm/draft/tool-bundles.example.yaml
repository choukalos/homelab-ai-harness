    - son
  allowed_channels:
    - cli
    - pi
    - ide
    - openwebui
  model_aliases:
    - local/qwen-coder
    - local/qwen-long
  tools:
    - name: search_web
      mcp_server: mcp_search
      description: "General web search"
    - name: search_recent
      mcp_server: mcp_search
      description: "Recent web search"
    - name: search_news
      mcp_server: mcp_search
      description: "News search"
    - name: kb_search
      mcp_server: mcp_knowledge
      description: "Search curated knowledge base"
    - name: kb_get_document
      mcp_server: mcp_knowledge
      description: "Retrieve a full document by ID"
    - name: kb_list_collections
      mcp_server: mcp_knowledge
      description: "List available knowledge collections"
    - name: read_file
      mcp_server: mcp_filesystem_readonly
      description: "Read a file (workspace and media only)"
    - name: list_directory
      mcp_server: mcp_filesystem_readonly
      description: "List directory contents"
    - name: search_files
      mcp_server: mcp_filesystem_readonly
      description: "Search files by pattern"
  disallowed_tools:
    - generate_image     # Not for coding
    - crawl              # Not needed for coding

