# ─── Per-Key → Bundle Mappings ────────────────────────────────────
#
# Key        | Primary Bundle | Secondary Bundles
# ───────────|────────────────|────────────────────────
# chuck      | bundle_admin   | (all access)
# son        | bundle_coding  | bundle_family
# openwebui  | bundle_family  | bundle_coding (for Chuck/son sessions)
# siri       | bundle_siri    | bundle_family
# automation | bundle_research| bundle_investing
# experiment | bundle_admin   | (Chuck only)

# ─── Rules ──────────────────────────────────────────────────────────
#
# 1. Do NOT copy this into the live LiteLLM config without review.
# 2. Start with bundle_siri and bundle_family (lowest risk).
# 3. Validate each bundle with a test key before exposing to users.
# 4. Monitor tool call logs for unexpected tool usage.
# 5. New bundles require manual approval and testing.
