name: morning_brief
version: "2.1"
description: "Daily new-stories digest — freshness-filtered news (last month) balanced across AI, tech (non-AI), and sports-car/manual-transmission car reviews; no-repeat via seen-store, per-story summaries with key data points, published as tap-friendly HTML."
inputs:
  - name: interests
    type: string
    required: false
    description: "Comma-separated list of interest topics. Overrides the default interest areas (AI / Tech / Cars) if provided."
  - name: max_items
    type: integer
    required: false
    default: 6
    description: "Maximum number of news items searched per interest query."
  - name: max_age_days
    type: integer
    required: false
    default: 30
    description: "Only surface stories published within the last N days (freshness window)."
  - name: max_stories
    type: integer
    required: false
    default: 6
    description: "Maximum number of NEW stories to surface in the digest (hard cap 10)."
  - name: publish
    type: boolean
    required: false
    default: false
    description: "Also publish the HTML digest to the public drop zone (single-file retention: overwrites the target)."
  - name: publish_path
    type: string
    required: false
    default: "/home/chuck/data/media/public/briefs/latest.html"
    description: "Destination file for the published HTML digest (public drop zone)."
config:
  # Default interest areas (label -> search queries). Selection round-robins
  # across areas so the digest stays balanced. The Tech area excludes
  # AI-leaning stories (covered by the AI area); the Cars area excludes
  # accident/incident news and focuses on manual-transmission / sports-car
  # reviews. Aggregator pages (MSN/Yahoo/AOL) that cannot be fetched are
  # dropped in favor of stories whose content could be read.
  default_interests:
    - "artificial intelligence news"   # AI
    - "technology news"                # Tech (non-AI)
    - "sports car reviews"             # Cars
    - "manual transmission car review" # Cars
  format: story_digest
  seen_store: /home/chuck/data/media/homelab_reports/morning_brief_seen.json
  seen_retention_days: 60
tools:
  - mcp_search   # search_news with days=freshness window
  - mcp_crawl    # crawl_page for per-story article content (best-effort)
model_alias: matrix-coder
artifact_path: /home/chuck/data/media/homelab_reports/
approval_gates: []
channels: [cli, pi, n8n]
max_runtime: 300  # seconds (search + crawl + LLM + publish)