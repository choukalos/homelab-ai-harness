name: marketing_strategy
version: "1.0"
description: "Go-To-Market (GTM) strategy generation — researches the market via mcp_search and synthesizes a full launch plan (TAM/SAM/SOM, competitive landscape, personas, positioning, pricing, channels, 30/60/90 launch plan) as a Markdown artifact."
inputs:
  - name: prompt
    type: string
    required: true
    description: "Product or service brief to build the GTM strategy for."
  - name: target_market
    type: string
    required: false
    description: "Optional target market or segment to focus the strategy on."
  - name: competitors
    type: string
    required: false
    description: "Optional comma-separated list of known competitors."
  - name: max_research_queries
    type: integer
    required: false
    default: 4
    description: "Maximum number of market-research web searches to run (1-8)."
tools:
  - mcp_search
model_alias: matrix-coder
artifact_path: /home/chuck/data/media/gtm_strategies/
approval_gates: []
channels: [cli, pi, n8n]
max_runtime: 300