name: investment_brief
version: "1.0"
description: "Investment brief — portfolio status, dividend highlights, market news. Configurable per user."
inputs:
  - name: user_email
    type: string
    required: false
    default: "choukalos@yahoo.com"
    description: "InvestorHub user email for portfolio lookup."
  - name: focus
    type: string
    required: false
    default: "dividend"
    enum: [dividend, growth, general]
    description: "Brief focus: dividend (high-yield picks), growth (tech/IPOs), general (balanced overview)."
  - name: max_holdings
    type: integer
    required: false
    default: 50
    description: "Max distinct holdings to analyze, aggregated across ALL of the user's portfolios."
  - name: publish
    type: boolean
    required: false
    default: true
    description: "Publish the brief as HTML to the public blog drop zone (https://choukalos.com/files/briefs/investment_brief.html)."
config:
  default_email: "choukalos@yahoo.com"
  max_artifacts: 3
  publish_path: "/home/chuck/data/media/public/briefs/investment_brief.html"
  public_url: "https://choukalos.com/files/briefs/investment_brief.html"
  investorhub_url: "https://invest.choukalos.com"
  interest_categories:
    - "dividend aristocrats"
    - "reliable dividend stocks"
    - "tech sector dividend payers"
tools:
  - mcp_mysql
  - mcp_search
model_alias: matrix-coder
artifact_path: /home/chuck/data/media/investment_briefs/
approval_gates: []
channels: [cli, pi, n8n]
max_runtime: 300
