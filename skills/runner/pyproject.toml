[project]
name = "thor-skill-runner"
version = "0.1.0"
description = "Thor Skill Runner — lightweight skill orchestration API on dev port 8091"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    # Skill manifest parsing for GET /skills (skill discovery).
    "pyyaml>=6.0",
    # Durable job index (MySQL backend; skill_jobs table in the homelab DB).
    "pymysql>=1.1.0",
    # Long-term memory (memory_todo.md Phase 2). Pinned to the version
    # verified in Phase 1 (round-trip + restore). See memory/ package.
    "mem0ai==2.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[project.scripts]
skill-runner = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
