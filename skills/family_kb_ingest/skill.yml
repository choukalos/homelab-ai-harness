name: family_kb_ingest
version: "1.0"
description: "Ingest files into the family knowledge base. Processes text, PDFs, etc. and stores in Qdrant."
inputs:
  - name: file_path
    type: string
    required: true
    description: "Path to the file to ingest."
  - name: collection
    type: string
    required: false
    default: family_kb
    description: "Target Qdrant collection."
tools: []
model_alias: local/qwen-coder
artifact_path: null
approval_gates: []
channels: [cli, pi, n8n]
max_runtime: 300
