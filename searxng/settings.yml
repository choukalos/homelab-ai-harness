use_default_settings: true

general:
  debug: false
  instance_name: "Chuck SearXNG"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false
  image_proxy: false

redis:
  url: redis://searxng-valkey:6379/0

