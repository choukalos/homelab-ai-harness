services:
  # --- INFRASTRUCTURE ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=false" 
      - "--providers.file.filename=/etc/traefik/rules.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Global header settings for Traefik v3
      - "--entrypoints.web.forwardedHeaders.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./rules.yml:/etc/traefik/rules.yml:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy

  # --- AI STACK ---
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    env_file: .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yml:/app/config.yaml:ro
    extra_hosts:
      - "macstudio:${MAC_STUDIO_IP}"
    networks:
      - proxy

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:8080"
    volumes:
      - ../data/open-webui:/app/backend/data
    environment:
      # Use the container name 'litellm' so traffic stays internal
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
    networks:
      - proxy

  # --- APPS ---
  ghost:
    image: ghost:5-alpine
    container_name: ghost-blog
    restart: unless-stopped
    env_file: .env
    ports:
      - "2368:2368"
    environment:
      - url=https://blog.choukalos.com
      # Ensure Ghost trusts the proxy headers
      - database__client=mysql
      - database__connection__host=172.17.0.1
      - database__connection__user=${GHOST_DB_USER}
      - database__connection__password=${GHOST_DB_PASS}
      - database__connection__database=${GHOST_DB_NAME}
    volumes:
      - ../data/ghost:/var/lib/ghost/content
    networks:
      - proxy

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${PGR_DB_NAME}
      - DB_POSTGRESDB_USER=${PGR_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${PGR_DB_PASS}
    networks:
      - proxy
      - backend
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${PGR_DB_USER}
      - POSTGRES_PASSWORD=${PGR_DB_PASS}
      - POSTGRES_DB=${PGR_DB_NAME}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend

networks:
  proxy:
    name: proxy
  backend:
    name: backend


