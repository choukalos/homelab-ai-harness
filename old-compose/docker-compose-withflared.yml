services:
  # --- NETWORKING & SECURITY ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy

  # --- PUBLIC FACING APPS (Via Traefik/Cloudflare) ---
#  finance-frontend:
#    image: your-finance-frontend:latest
#    container_name: finance-app
#    networks:
#      - proxy
#    labels:
#      - "traefik.enable=true"
#      - "traefik.http.routers.finance.rule=Host(`finance.${DOMAIN_NAME}`)"
#      - "traefik.http.services.finance.loadbalancer.server.port=80"

  ghost-blog:
    image: ghost:latest
    container_name: ghost-blog
    volumes:
      - ../data/ghost:/var/lib/ghost/content
    environment:
      url: https://blog.${DOMAIN_NAME}
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost.rule=Host(`blog.${DOMAIN_NAME}`)"
      - "traefik.http.services.ghost.loadbalancer.server.port=2368"

  # --- INTERNAL SERVICES (Local Access + Optional Remote API) ---
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    env_file: .env
    ports:
      - "4000:4000" # Local access
    volumes:
      - ./litellm/config.yml:/app/config.yaml:ro
    extra_hosts:
      - "macstudio:${MAC_STUDIO_IP}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`api.${DOMAIN_NAME}`)"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    env_file: .env
    ports:
      - "3000:8080" # Local access
    volumes:
      - ../data/open-webui:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
    networks:
      - proxy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    env_file: .env
    ports:
      - "5678:5678" # Local access
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
    volumes:
      - ../data/n8n:/home/node/.n8n
    networks:
      - proxy
      - backend
    depends_on:
      - postgres
    restart: unless-stopped

  # --- DATABASES (No Direct Access) ---
  postgres:
    image: postgres:16
    container_name: postgres
    env_file: .env
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
    volumes:
      - ../data/mysql:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

networks:
  proxy:
  backend:


