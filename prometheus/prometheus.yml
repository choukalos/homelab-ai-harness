global:
  scrape_interval: 15s
scrape_configs:
- job_name: victoria-metrics
  static_configs:
  - targets:
    - localhost:8428
- job_name: node-exporter-local
  static_configs:
  - targets:
    - node-exporter:9100
    labels:
      instance: thor
- job_name: cadvisor-local
  static_configs:
  - targets:
    - cadvisor:8080
    labels:
      instance: thor
- job_name: litellm
  metrics_path: /metrics/
  static_configs:
  - targets:
    - host.docker.internal:4000
    labels:
      instance: litellm
- job_name: node-exporter-matrix
  static_configs:
  - targets:
    - matrix:9100
    labels:
      instance: matrix
- job_name: dcgm-matrix
  static_configs:
  - targets:
    - matrix:9400
    labels:
      instance: matrix
- job_name: node-exporter-athena
  static_configs:
  - targets:
    - athena:9100
    labels:
      instance: athena
- job_name: cadvisor-athena
  static_configs:
  - targets:
    - athena:9080
    labels:
      instance: athena
