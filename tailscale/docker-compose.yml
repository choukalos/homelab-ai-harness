# Tailscale node — fully independent project.
# No shared networks, volumes, or .env with the rest of the homelab.
#
# The SAME file works on every machine (thor, matrix, synology, lego).
# Only tailscale/.env differs per machine (auth key + optional hostname/routes).
#
# How it works:
#   - network_mode: host  → the tailscale0 interface is created on the host
#     itself, so the host's IP (e.g. ssh chuck@thor.<tailnet>) works directly.
#   - ts-state volume     → the machine key persists across restarts/rebuilds.
#   - TS_AUTHKEY          → one-time auth key from the admin panel; consumed
#     on first login. If left empty, `docker exec tailscale tailscale status`
#     prints a manual login URL instead.

name: tailscale

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=${TS_HOSTNAME:-}
      - TS_USERSPACE=false
      # Subnet router: advertise LAN routes so other tailnet devices can reach
      # your LAN through this node (approve the routes in the admin panel).
      # - TS_ROUTES=192.168.4.0/22,192.168.5.0/24
      # Extra tailscaled flags, if ever needed:
      # - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ts-state: