# 10-tailnet-sshd.conf — install to /etc/ssh/sshd_config.d/
#
# Tailscale clients arrive with source IP in 100.64.0.0/10 (Tailscale
# routes, it does not NAT). Require key auth from the tailnet; LAN and
# everything else keeps the existing policy (password auth stays fine
# at home).
#
# Install:
#   sudo cp 10-tailnet-sshd.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh
Match Address 100.64.0.0/10
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes